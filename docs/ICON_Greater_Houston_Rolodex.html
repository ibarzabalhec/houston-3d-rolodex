/* ------------------------------------------------------------------ tokens
   Read off iconbuild.com: white ground, near-black ink, neutral concrete
   greys, one orange. The site's display face is ICON's proprietary
   Lightspeed, substituted here with the closest available grotesk. Large
   tight display type, hairline rules, solid pill tags and a circled arrow
   are the four devices the site actually uses.                            */
:root{
  --paper:#FFFFFF; --paper2:#FAFAFA; --paper3:#F2F2F2;
  --ink:#111111; --ink2:#3D3D3D; --ink3:#6B6B6B; --ink4:#8C8C8C;
  --rule:#E4E4E4; --rule2:#CFCFCF;
  --orange:#FF4F00;
  /* aliases the ported Americas atmosphere reads */
  --accent-warm:#FF4F00; --text-primary:#111111;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* The ground. A grain dot, a masked grid and three soft washes that drift on a
   slow loop. Same device as the Americas deck, translated to the light palette:
   at these opacities it reads as paper rather than as decoration. */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--paper)}
.bg .grain{position:absolute;inset:0;
  background-image:radial-gradient(rgba(17,17,17,.055) 1px, transparent 1px);
  background-size:3px 3px}
#atmos{position:fixed;top:-20px;left:-20px;width:calc(100vw + 40px);height:calc(100vh + 40px);
  z-index:-1;pointer-events:none;opacity:.5;transition:opacity 400ms ease;will-change:transform}
@media print{.bg,#atmos{display:none}}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 16px}}

/* ------------------------------------------------------------------- type */
.disp{font-weight:800;letter-spacing:-.04em;line-height:.94;text-wrap:balance}
.lab{font:600 10px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.mono{font-family:var(--mono)}

/* -------------------------------------------------------------------- nav */
/* The wordmark sits on solid paper. At .88 the contour field behind it ghosts
   through, which reads as a rendering fault rather than a decision. */
nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--ink)}
.navin{display:flex;align-items:center;gap:14px;height:56px;flex-wrap:wrap}
.navtools{display:flex;align-items:center;gap:14px;flex:0 0 auto;min-width:0}
.mark{display:flex;align-items:baseline;gap:9px;font:700 17px/1 var(--sans);letter-spacing:-.02em}
.mark i{display:block;width:5px;height:5px;border-radius:50%;background:var(--orange);
  transform:translateY(-7px)}
.mark span{font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.navsp{flex:1}
#q{font:400 13px/1 var(--sans);color:var(--ink);background:var(--paper3);border:0;
  border-radius:2px;padding:9px 11px;width:230px;outline:none}
#q::placeholder{color:var(--ink3)}
#q:focus{box-shadow:inset 0 0 0 1px var(--ink)}
.seg{display:flex;border:1px solid var(--rule2);border-radius:2px;overflow:hidden}
.seg button{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:9px 12px;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.cbtn{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--ink);border-radius:2px;padding:9px 12px;display:flex;gap:8px;align-items:center}
.cbtn b{font:700 10px/1 var(--mono)}
.cbtn.on{background:var(--ink);color:#fff}
@media(max-width:860px){#q{width:150px}.mark span{display:none}}
/* Below this the four view buttons no longer fit beside the search box. They get
   their own row rather than being crushed to a hairline by overflow:hidden. */
@media(max-width:760px){
  .navin{height:auto;padding-block:10px;gap:10px;row-gap:10px}
  .navtools{order:5;flex:1 0 100%;gap:10px}
  #q{flex:1 1 auto;width:auto;min-width:0}
  .seg{flex:0 0 auto}
  .seg button{padding:9px 10px;letter-spacing:.06em}
}
@media(max-width:460px){
  .navtools{flex-wrap:wrap}
  #q{flex:1 0 100%}
  .seg{flex:1 0 100%}
  .seg button{flex:1;padding:10px 4px;letter-spacing:.04em}
  .cbtn{padding:9px 10px}
}

/* ------------------------------------------------------------------ header */
header.top{padding:56px 0 30px}
/* The masthead's second half was empty at every width above a tablet. It now
   carries the second count, drawn: every firm with a published annual figure,
   placed against the machine-fit bands. The same figure lives in full on the
   Market view; here it is the signature. */
.hero-grid{display:grid;grid-template-columns:1fr;gap:34px}
.hero-fig{margin:6px 0 0;min-width:0;max-width:1040px}
.hero-fig svg{display:block;width:100%;height:auto;overflow:visible}
.hero-fig .hband{fill:var(--paper3)}
.hero-fig .hband.b1{fill:var(--paper2)}
.hero-fig .hgrid{stroke:var(--rule);stroke-width:1}
.hero-fig .hbase{stroke:var(--ink);stroke-width:1}
.hero-fig .hax{font:500 10px var(--mono);fill:var(--ink3);text-anchor:middle}
.hero-fig .hlab{font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;fill:var(--ink3)}
.hero-fig .hdot{fill:var(--ink);stroke:var(--paper);stroke-width:2;paint-order:stroke;cursor:pointer}
.hero-fig .hdot.partial{fill:var(--ink3)}
.hero-fig .hdot:hover{fill:var(--orange)}
.hero-fig .hname{font:600 12px var(--sans);fill:var(--ink)}
.hero-fig .hname.sub{fill:var(--ink3);font-weight:500}
.hero-fig .hcap{font:500 12px/1.5 var(--sans);fill:var(--ink3)}
.hero-fig .hcap a{fill:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.hero-fig .rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.hero-fig .rise{animation:none}}
@media print{.hero-fig{display:none}}
/* at phone width the strip scales to a hairline; the Market view carries the full figure */
@media(max-width:760px){.hero-fig{display:none}}
header.top h1{margin:12px 0 0;font-size:clamp(34px,5.4vw,72px);color:var(--ink3);max-width:20ch}
header.top h1 b{color:var(--ink);font-weight:700}
header.top .sub{margin:22px 0 0;max-width:62ch;font-size:15px;color:var(--ink2);line-height:1.62}
header.top .by{margin-top:18px;text-transform:none;letter-spacing:.04em;font-size:11px}
.stats{display:flex;flex-wrap:wrap;gap:0;margin:34px 0 0;border-top:1px solid var(--ink)}
.stat{flex:1 1 150px;padding:14px 16px 16px 0;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0}
.stat b{display:block;font:800 38px/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:5px;font:600 9.5px/1.35 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3)}
.stat.hot b{color:var(--ink)}

/* ----------------------------------------------------------------- filters */
.filters{padding:20px 0 18px}
/* Five controls, not seventeen chips. Each opens a small menu; what is actually
   applied is shown underneath as removable chips with a reset that is always
   present once anything is on. */
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fsel{position:relative}
.fsel > button{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule2);border-radius:2px;padding:10px 13px;color:var(--ink);
  background:var(--paper);display:inline-flex;align-items:center;gap:9px}
.fsel > button:hover{border-color:var(--ink)}
.fsel > button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fsel > button .car{font-size:8px;color:var(--ink3)}
.fsel > button .nsel{background:var(--ink);color:#fff;border-radius:99px;
  min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;padding:0 4px}
.fsel.open > button{border-color:var(--ink);background:var(--paper3)}
.fmenu{position:absolute;top:calc(100% + 5px);left:0;z-index:70;min-width:255px;max-height:340px;
  overflow:auto;background:var(--paper);border:1px solid var(--ink);border-radius:2px;
  box-shadow:0 14px 40px rgba(17,17,17,.14);padding:5px}
.fmenu button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;
  font:500 13px/1.3 var(--sans);color:var(--ink);padding:9px 10px;border-radius:2px}
.fmenu button:hover{background:var(--paper3)}
.fmenu button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.fmenu button i{width:13px;height:13px;border:1px solid var(--rule2);border-radius:2px;
  flex:none;display:block;background:var(--paper)}
.fmenu button[aria-checked="true"] i{background:var(--ink);border-color:var(--ink);
  box-shadow:inset 0 0 0 2px var(--paper)}
.fmenu button s{margin-left:auto;text-decoration:none;font:600 10px/1 var(--mono);color:var(--ink3)}
.fmenu button[disabled]{opacity:.38}
.fapplied{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px;min-height:1px}
.fapplied .ac2{font:600 10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;
  border:1px solid var(--ink);border-radius:99px;padding:6px 7px 6px 11px;color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;background:var(--paper)}
.fapplied .ac2 span{font-size:13px;line-height:1;color:var(--ink3)}
.fapplied .ac2:hover span{color:var(--ink)}
.freset{font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:99px;padding:7px 13px}
.freset:hover{background:var(--ink2);border-color:var(--ink2)}
.freset:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fcount{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
@media(max-width:640px){
  .fmenu{min-width:min(78vw,255px)}
  /* three rows of controls pushes the table off the screen on a phone */
  .fbar{gap:6px}
  .fsel > button{padding:9px 9px;letter-spacing:.05em;gap:6px}
  .fcount{flex:1 0 100%;order:9}
  .legend i{font-size:11.5px}
  .legend i.rule{margin-left:0;flex:1 0 100%}
}
.fbtn{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule2);border-radius:2px;padding:9px 12px;color:var(--ink3)}
.fbtn b{margin-left:7px;color:var(--ink)}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fbtn.on b{color:#fff}
.fnote{font-size:12.5px;color:var(--ink3);flex:1 1 260px;min-width:200px}

/* ------------------------------------------------------------------ matrix */
.mwrap{display:grid;grid-template-columns:34px 1fr;gap:0}
.ylab{writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;
  font:600 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  padding:0 10px 0 0}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;
  border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:12px 12px 14px;min-height:104px;background:var(--paper)}
.cell.best{background:var(--paper2)}
.chead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.chead b{font:700 17px/1 var(--sans);letter-spacing:-.02em}
.chead span{font:600 9px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:500 12px/1 var(--sans);letter-spacing:-.01em;padding:7px 9px;border-radius:2px;
  border:1px solid var(--rule2);color:var(--ink2);background:var(--paper);text-align:left}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.i-clear{background:var(--orange);border-color:var(--orange);color:var(--ink);font-weight:700}
.chip.i-partial{border-color:var(--ink3);color:var(--ink);background:var(--paper3)}
.chip.printing{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip.printing.i-clear{color:var(--ink)}
.chip.printing.i-clear{background:var(--orange);border-color:var(--orange)}
.chip.printing::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#fff;margin-left:7px;vertical-align:middle}
.chip.dim{opacity:.2}
.chip.sel{box-shadow:0 0 0 2px var(--ink)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.xrow{display:grid;grid-template-columns:repeat(3,1fr);margin-left:34px}
.xrow div{font:600 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);padding:10px 12px}
.xrow div.hi{color:var(--ink)}
.xtitle{margin:2px 0 0 34px;font:600 10px/1 var(--mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3)}
.mnote{margin:26px 0 0;max-width:78ch;font-size:14.5px;line-height:1.65;color:var(--ink2)}
.mnote b{font-weight:700;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 22px;
  padding:14px 0 0;border-top:1px solid var(--rule)}
.legend i{display:flex;align-items:center;gap:8px;font-style:normal;font-size:12.5px;color:var(--ink3)}
.legend i.rule{display:block;margin-left:auto;color:var(--ink2);font-size:12.5px}
.legend i.rule b{font-weight:700;color:var(--ink)}
.legend .sw{width:14px;height:14px;border-radius:2px;border:1px solid var(--rule2)}
.legend .sw.o{background:var(--orange);border-color:var(--orange)}
.legend .sw.p{border-color:var(--ink3);background:var(--paper3)}
.legend .sw.k{background:var(--ink);border-color:var(--ink);position:relative}
.legend .sw.k::after{content:"";position:absolute;left:4px;top:4px;width:4px;height:4px;border-radius:50%;background:#fff}
@media(max-width:720px){
  .matrix{grid-template-columns:1fr}
  .xrow{display:none}.ylab{display:none}.mwrap{grid-template-columns:1fr}
  .xtitle{margin-left:0}
}

/* -------------------------------------------------------------------- list */
.scroll{overflow-x:auto;position:relative;border-top:1px solid var(--ink)}
/* A table wider than the phone says so: a fade on the edge that has more, and one line above it. */
.swipe{position:relative}
.swipe::after{content:'';position:absolute;top:1px;right:0;bottom:0;width:56px;pointer-events:none;
  background:linear-gradient(to right,rgba(255,255,255,0),var(--paper) 85%);opacity:0;transition:opacity .2s}
.swipe.more::after{opacity:1}
.swipe-hint{display:none;margin:0 0 8px;color:var(--ink3)}
.swipe.more .swipe-hint{display:block}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font:600 9.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:12px 14px 12px 0;border-bottom:1px solid var(--rule)}
td{padding:13px 14px 13px 0;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:top}
td.f{font-weight:600;letter-spacing:-.01em;padding:0}
.fbtn2{display:block;width:100%;text-align:left;font:600 inherit/inherit var(--sans);
  font-size:14px;letter-spacing:-.01em;color:var(--ink);padding:13px 14px 13px 0}
.fbtn2:hover{text-decoration:underline;text-underline-offset:3px}
.fbtn2:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.ac{width:44px;text-align:right}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.rowadd{width:26px;height:26px;border:1px solid var(--rule2);border-radius:2px;
  font:700 13px/1 var(--mono);color:var(--ink3);background:var(--paper)}
.rowadd:hover{border-color:var(--ink);color:var(--ink)}
.rowadd.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rowadd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grpadd{float:right;font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);border:1px solid var(--rule2);border-radius:2px;padding:5px 8px;
  background:var(--paper)}
.grpadd:hover{border-color:var(--ink);color:var(--ink)}
.grpadd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
tr.grp td{font:600 9.5px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);background:var(--paper3);padding:10px 14px 10px 10px}
tr.grp em{font:400 11px/1.5 var(--sans);letter-spacing:0;text-transform:none;
  color:var(--ink3);font-style:normal;margin-left:10px}
.mzero{margin:22px 0 0;font:600 13px/1.6 var(--sans);color:var(--ink2)}
.yn{font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;
  border-radius:2px;border:1px solid var(--rule2);color:var(--ink3)}
.yn.clear{background:var(--ink);border-color:var(--ink);color:#fff}
.yn.partial{border-color:var(--ink3);color:var(--ink);background:var(--paper3)}
.yn.innovation.clear{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.mini.press li{margin-bottom:10px}
.mini.press a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule2)}
.mini.press a:hover{border-bottom-color:var(--ink)}
.mini.press .out{display:block;font:500 10.5px/1.5 var(--mono);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink4);margin-top:3px}
.yn.chk{border-color:var(--ink3);color:var(--ink);background:var(--paper3);
  border-style:dashed}
.empty{color:var(--ink3);font-size:14px;padding:26px 0}

/* --------------------------------------------------------------- firm page */
#stageFirm{display:none;padding-bottom:80px}
#stageFirm.on{display:block}
.back{display:inline-flex;align-items:center;gap:10px;margin:26px 0 0;
  font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.back:hover{color:var(--ink)}
.arrow{width:22px;height:22px;border:1px solid currentColor;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.arrow svg{width:9px;height:9px}
.fhead{padding:26px 0 30px;border-bottom:1px solid var(--ink)}
.fhead h2{margin:0;font-size:clamp(32px,5.4vw,66px)}
.fhead .kst{margin:16px 0 0;font:600 11px/1.5 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3)}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 0;align-items:center}
.tag{font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  background:var(--ink3);color:#fff;border-radius:99px;padding:7px 11px}
.tag.k{background:var(--ink)}
.tag.o{background:var(--orange);color:var(--ink)}
.tag.q{background:none;color:var(--ink3);border:1px solid var(--rule2)}
.cnote{margin:18px 0 0;font-size:12.5px;color:var(--ink3)}
.lnk{display:inline-flex;align-items:center;gap:7px;font:600 9.5px/1 var(--mono);
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink);border:1px solid var(--rule2);
  border-radius:99px;padding:6px 11px 6px 8px}
.lnk:hover{border-color:var(--ink);background:var(--ink);color:#fff}
.lnk svg{width:13px;height:13px;flex:none}
.row{display:grid;grid-template-columns:186px 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--rule)}
.row>.body{min-width:0}
@media(max-width:720px){.row{grid-template-columns:1fr;gap:12px;padding:22px 0}}
.verdict{margin:0;font-size:19px;line-height:1.45;letter-spacing:-.012em;max-width:70ch}
.syn{margin:0;font-size:14.5px;line-height:1.65;color:var(--ink2);max-width:74ch}

/* three counts */
.why{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.why li{display:grid;grid-template-columns:78px 1fr;gap:16px;align-items:start;
  padding:14px 0;border-top:1px solid var(--rule)}
.why li:first-child{border-top:0}
.vv{font:700 13px/1 var(--sans);letter-spacing:-.01em}
.vv.clear{color:var(--ink)}
.vv.partial{color:var(--ink2)}
.vv.fail{color:var(--ink3)}
/* orange means one thing on this page: the firm has paid for an unproven method */
.why li.inn .vv.clear{background:var(--orange);color:var(--ink);
  border-radius:2px;padding:3px 7px;margin-left:-7px;display:inline-block;justify-self:start}
.why b{display:block;font:600 13.5px/1.35 var(--sans);margin-bottom:4px}
.why .tx{display:block;font-size:13.5px;line-height:1.6;color:var(--ink2)}

/* people */
.p1{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:start;
  padding:14px 0;border-top:1px solid var(--rule)}
.p1:first-child{border-top:0}
.p1.dec{background:var(--paper2);border-radius:3px;padding:14px 12px;margin:0 -12px}
.p1 .nm{font:600 15px/1.3 var(--sans);letter-spacing:-.01em}
.p1 .rl{font-size:13px;color:var(--ink3);margin-top:2px}
.p1 .rl.warn{color:var(--ink);font-weight:600;margin-top:6px;max-width:60ch}
.p1 .ev{grid-column:1/-1;font-size:12.5px;line-height:1.55;color:var(--ink3);
  border-left:2px solid var(--rule2);padding-left:11px;margin-top:8px}
.p1 .ev em{font-style:normal;color:var(--ink2);font-weight:600}
.p1.gone .nm{color:var(--ink3)}
.badge{display:inline-block;margin-left:9px;font:700 8.5px/1 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;background:var(--ink);color:#fff;border-radius:99px;padding:5px 8px;
  vertical-align:middle}
.badge.g{background:var(--ink4)}
.icons{display:flex;gap:6px;align-items:center}
.ic{width:30px;height:30px;border:1px solid var(--rule2);border-radius:2px;display:flex;
  align-items:center;justify-content:center;color:var(--ink2);flex:none}
.ic:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.ic svg{width:15px;height:15px}
.ic.li:hover{background:#0A66C2;border-color:#0A66C2}

/* evidence, capital, flags */
.pj{padding:14px 0;border-top:1px solid var(--rule)}
.pj:first-child{border-top:0}
.pj b{font:600 14.5px/1.35 var(--sans)}
.pj .d{font-size:13.5px;line-height:1.6;color:var(--ink2);margin-top:4px}
.pj .s{margin-top:8px;font-size:12.5px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sig{font:600 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule2);border-radius:99px;padding:5px 8px;color:var(--ink3)}
ul.mini{list-style:none;margin:0;padding:0}
ul.mini li{padding:11px 0;border-top:1px solid var(--rule);font-size:13.5px;line-height:1.6;color:var(--ink2)}
ul.mini li:first-child{border-top:0}
.dt{font:600 10px/1 var(--mono);letter-spacing:.06em;color:var(--ink4);margin-right:9px}
ul.flags li{color:var(--ink2)}
blockquote{margin:0;font-size:19px;line-height:1.5;letter-spacing:-.012em;max-width:62ch}
blockquote footer{margin-top:12px;font:600 10px/1.5 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3)}
.src{display:inline-flex;align-items:center;gap:5px;font:600 9.5px/1 var(--mono);
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--rule2)}
.src:hover{color:var(--ink);border-color:var(--ink)}
.note{font-size:13px;line-height:1.6;color:var(--ink3);font-style:italic}
.addbtn{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--ink);border-radius:2px;padding:12px 16px;margin-top:26px}
.addbtn.on{background:var(--ink);color:#fff}
.clact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:30px;
  padding-top:24px;border-top:1px solid var(--rule)}
.clact .addbtn{margin-top:0}
.xnote{flex:1 0 100%;margin:4px 0 0;font:600 11px/1.5 var(--mono);color:var(--ink3)}
.fx{font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule2);border-radius:2px;padding:9px 12px;color:var(--ink);
  background:var(--paper)}
.fx:hover{border-color:var(--ink);background:var(--paper3)}
.fx:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* the scroll view */
.rail{position:sticky;top:56px;margin-top:22px;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--ink);padding:14px 0 12px;margin-bottom:4px}
.frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 0}
.frow > b{font:600 9px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink4);
  width:74px;flex:none}
.fc{font:600 10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;
  border:1px solid var(--rule2);border-radius:99px;padding:7px 11px;color:var(--ink3);background:#fff;
  display:inline-flex;align-items:center;gap:7px}
.fc:hover{border-color:var(--ink);color:var(--ink)}
.fc i{width:5px;height:5px;border-radius:50%;background:var(--rule2);display:block}
.fc.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fc.on i{background:var(--orange)}
.fc.on.o{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.fc.on.o i{background:#fff}
.fc s{text-decoration:none;color:var(--ink4);font-size:9px}
.fc.on s{color:rgba(255,255,255,.7)}
.rcount{font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  border:0!important;background:none!important;
  border:1px solid var(--ink);border-radius:99px;padding:7px 11px}
.rclear{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  border-bottom:1px solid var(--rule2);padding-bottom:2px;cursor:pointer}
.rclear:hover{color:var(--ink);border-color:var(--ink)}
.sc{display:grid;grid-template-columns:1fr 300px;gap:34px;padding:26px 0;border-bottom:1px solid var(--rule);
  cursor:pointer}
.sc:hover .scname{text-decoration:underline;text-underline-offset:3px}
.sc.pin{background:linear-gradient(90deg,rgba(255,79,0,.045),transparent 60%);
  margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:3px}
.scname{font:700 27px/1.05 var(--sans);letter-spacing:-.03em;display:flex;align-items:baseline;
  gap:11px;flex-wrap:wrap}
.scname em{font-style:normal;font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3)}
.scv{margin:10px 0 0;font-size:14.5px;line-height:1.6;color:var(--ink2);max-width:66ch}
.scwho{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.scp{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.scp b{font-weight:600;color:var(--ink)}
.scp .ic{width:24px;height:24px}
.scp .ic svg{width:12px;height:12px}
.scc{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--rule);padding-left:18px}
.scc div{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);
  font-size:12px;color:var(--ink3);align-items:center}
.scc div:last-child{border-bottom:0}
.scc span.v{font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink4)}
.scc span.v.clear{color:var(--ink)}
.scc span.v.partial{color:var(--ink2)}
.scc div.inn span.v.clear{background:var(--orange);color:var(--ink);border-radius:2px;padding:2px 5px}
@media(max-width:820px){.sc{grid-template-columns:1fr;gap:16px}
  .scc{border-left:0;padding-left:0;border-top:1px solid var(--rule)}}

/* cover flow. The geometry, the easing and the drag discrimination are ported
   from the Americas rolodex: 96px spacing, a 180px edge shift, 110px of depth
   per step, 58 degrees of rotation at the edge, 0.82 scale at one step out and
   a 0.16 ease factor, which is what makes it feel like an iPod rather than a
   carousel. Only the card face is ours. */
.cfshell{position:relative;padding:6px 0 40px}
.cf-stage{position:relative;height:460px;perspective:2400px;perspective-origin:50% 46%;
  overflow:hidden;touch-action:pan-y;cursor:grab;z-index:1;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%)}
.cf-stage.dragging{cursor:grabbing}
.cf-scene{position:absolute;top:0;left:50%;width:0;height:100%;transform-style:preserve-3d}
.cf-card{position:absolute;top:50%;left:0;width:300px;height:300px;margin-top:-150px;
  margin-left:-150px;transform-style:preserve-3d;will-change:transform,opacity;cursor:pointer}
.cf-card:focus{outline:none}
.cf-card:focus-visible .tile{outline:2px solid var(--ink);outline-offset:3px}
.cf-card .tile{position:relative;width:100%;height:100%;background:#fff;
  border:1px solid var(--rule2);padding:17px 19px;display:flex;flex-direction:column;gap:7px;
  box-shadow:0 18px 40px rgba(17,17,17,.09);overflow:hidden}
.cf-card .tile::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(17,17,17,.05) 1px,transparent 1px);background-size:4px 4px}
.cf-card .tile .pip{position:absolute;top:0;left:0;width:46px;height:4px;background:var(--ink);z-index:3}
.cf-card.i-clear .tile .pip{background:var(--orange)}
.cf-card.adopter .tile .pip{width:100%;background:var(--ink)}
.cf-card .t-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font:600 9px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  position:relative;z-index:2}
.cf-card .t-row .tier{border:1.5px solid currentColor;border-radius:2px;padding:3px 7px;
  font-weight:700;letter-spacing:.12em}
.cf-card .cname{font-weight:700;letter-spacing:-.025em;line-height:1.05;color:var(--ink);
  position:relative;z-index:2}
.cf-card .csyn{font-size:12px;line-height:1.5;color:var(--ink2);position:relative;z-index:2;
  overflow:hidden;flex:1}
.cf-card .crow{display:flex;gap:4px;position:relative;z-index:2;flex-wrap:wrap}
.cf-card .crow span{font:700 7.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--rule2);border-radius:2px;padding:5px 5px;color:var(--ink3);white-space:nowrap}
.cf-card .crow span.clear{color:var(--ink);border-color:var(--ink3)}
.cf-card .crow span.m2.clear{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.cf-card .url-row{font:500 10px/1.3 var(--mono);color:var(--ink3);position:relative;z-index:2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf-card .url-row.muted{color:var(--ink4)}
.cf-card .reflection{position:absolute;top:100%;left:0;width:100%;height:100%;
  height:56%;transform:scaleY(-1);transform-origin:center;opacity:.13;pointer-events:none;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(to top,#000,transparent 82%);
  mask-image:linear-gradient(to top,#000,transparent 82%)}
.cf-card .reflection .tile{box-shadow:none}
/* the mirrored copy doubles the paint cost of every visible card */
.cf-stage.dragging .reflection{display:none}
/* on a phone the card is short enough that the mirrored badges read as a fault */
@media(max-width:640px){.cf-card .reflection{display:none}}
.cf-stage.dragging .tile::before{display:none}
.cf-title{text-align:center;margin:18px 0 0}
.cf-title .name{font:700 clamp(22px,3vw,34px)/1.1 var(--sans);letter-spacing:-.03em}
.cf-title .meta{margin-top:8px;font:600 10px/1.5 var(--mono);letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink3)}
.cf-title .badge2{display:inline-block;margin-top:12px;font:700 9px/1 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;border:1px solid var(--ink);border-radius:2px;padding:6px 10px}
.cf-title .badge2.o{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.cf-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:22px 0 0}
.cf-btn{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule2);border-radius:2px;padding:10px 14px;color:var(--ink2)}
.cf-btn:hover{border-color:var(--ink);color:var(--ink)}
.cf-scrub{position:relative;height:3px;width:min(420px,38vw);background:var(--rule)}
.cf-scrub i{position:absolute;top:-3px;width:3px;height:9px;background:var(--orange);
  transition:left 90ms linear}
.cf-count{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  min-width:92px;text-align:center}
@media(max-width:720px){.cf-stage{height:380px}.cf-scrub{width:34vw}}

/* the field */
.cmp{padding:26px 0;border-bottom:1px solid var(--rule)}
.cmp h3{margin:0;font:700 26px/1.05 var(--sans);letter-spacing:-.03em;display:flex;
  align-items:baseline;gap:12px;flex-wrap:wrap}
.cmp .where{font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.cmp .st{font:700 8.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border-radius:99px;padding:5px 9px;background:var(--ink);color:#fff}
.cmp .st.dead{background:var(--ink2)}
.cmp .st.warn{border:1px solid var(--ink3);color:var(--ink3);background:none}
.cmp .cl3{margin:10px 0 0;font-size:16px;line-height:1.5;letter-spacing:-.01em;max-width:70ch}
.cmp dl,.us dl{margin:16px 0 0;display:grid;grid-template-columns:190px 1fr;gap:0}
.cmp dt,.us dt{font:600 9.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);padding:12px 16px 12px 0;border-top:1px solid var(--rule)}
.cmp dd,.us dd{margin:0;padding:12px 0;border-top:1px solid var(--rule);font-size:13.5px;
  line-height:1.62;color:var(--ink2)}
@media(max-width:640px){.cmp dl,.us dl{grid-template-columns:1fr}.cmp dd,.us dd{padding-top:0;border-top:0}}
.us{background:var(--paper2);border:1px solid var(--ink);border-radius:3px;padding:22px 22px 8px;margin:0 0 34px}
.us h3{margin:0;font:700 24px/1.05 var(--sans);letter-spacing:-.03em}
.us .cl3{color:var(--ink);font-weight:600;font-size:15px}

/* competitor */
.comp{margin:46px 0 0;border-top:2px solid var(--ink);padding-top:24px}
.comp h2{margin:0;font:700 30px/1 var(--sans);letter-spacing:-.03em}
.comp .cl2{margin:10px 0 18px;font-size:15px;color:var(--ink);font-weight:600}
.comp dl{margin:0;display:grid;grid-template-columns:170px 1fr;gap:0}
.comp dt{font:600 9.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);padding:13px 16px 13px 0;border-top:1px solid var(--rule)}
.comp dd{margin:0;padding:13px 0;border-top:1px solid var(--rule);font-size:13.5px;
  line-height:1.6;color:var(--ink2)}
@media(max-width:640px){.comp dl{grid-template-columns:1fr}.comp dd{padding-top:0;border-top:0}}

/* limits + footer */
.limits{margin:54px 0 0;border-top:2px solid var(--ink)}
.lim{display:grid;grid-template-columns:186px 1fr;gap:28px;padding:16px 0;border-bottom:1px solid var(--rule)}
.lim b{font:600 9.5px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.lim span{font-size:13.5px;line-height:1.62;color:var(--ink2)}
@media(max-width:720px){.lim{grid-template-columns:1fr;gap:6px}}
/* On a phone the list stops being a table. Seven columns inside 358px meant a
   sideways swipe past a sticky firm name that covered the counts you were
   swiping to reach, so the counts were unreachable. Each firm is now one
   stacked block: name, then the three counts and the decision-maker as labelled
   chips, with the call-list button in the corner. No sideways scroll at all. */
@media(max-width:640px){
  #stageList .scroll{overflow-x:visible;border-top:0}
  #stageList table{min-width:0;display:block}
  #stageList thead{display:none}
  #stageList tbody{display:block}
  #stageList tr{display:block;position:relative;border-bottom:1px solid var(--rule);
    padding:14px 44px 14px 0}
  #stageList td{display:inline-flex;align-items:baseline;gap:8px;border:0;padding:0;
    font-size:13px;margin:0 16px 0 0}
  #stageList td[data-l]::before{content:attr(data-l);font:600 9px/1.4 var(--mono);
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
  #stageList td.f{display:block;width:100%;margin:0 0 3px}
  #stageList td.f .fbtn2{padding:0;font-size:15px;line-height:1.3}
  #stageList td.hf{display:block;width:100%;margin:3px 0 0;color:var(--ink2);line-height:1.5}
  #stageList td.hf::before{display:block;margin-bottom:3px}
  #stageList td.hf:empty{display:none}
  #stageList td.ac{position:absolute;top:12px;right:0;width:auto;margin:0}
  #stageList tr.grp{padding:16px 0 10px;border-bottom:1px solid var(--ink);background:none}
  #stageList tr.grp td{display:block;width:100%;margin:0;background:none}
  #stageList tr.grp em{display:block;margin:4px 0 0}
  #stageList tr.grp .grpadd{float:none;display:inline-block;margin:10px 0 2px}
  #stageList td[data-l]:empty{display:none}
  #stageList tr:not(.grp){display:flex;flex-wrap:wrap;align-items:baseline;
    column-gap:18px;row-gap:7px}
  #stageList tr:not(.grp) td[data-l]:not(.hf){flex:0 0 calc(50% - 9px);margin:0;
    justify-content:flex-start;min-width:0}
  #stageList td[data-l]:not(.hf)::before{flex:0 0 auto}
  #stageList tr:has(td.empty){padding:24px 0}
  .swipe::after{display:none}
  .swipe-hint{display:none!important}
  .legend{gap:12px 18px}
  /* other tables on the page keep the sticky-first-column treatment */
  .ctab td:first-child,.ctab th:first-child{position:sticky;left:0;background:var(--paper);z-index:1}
  .ctab th,.ctab td{padding-right:8px}}
.end{padding:34px 0 60px;font:600 9.5px/1.7 var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink3)}

/* code and precedent, method */
.codeblk{margin:46px 0 0;border-top:2px solid var(--ink);padding-top:24px}
.codeblk h3,.figs.method h3{margin:6px 0 0;font:700 26px/1.1 var(--sans);letter-spacing:-.03em}
.codeblk .cl3{margin:12px 0 6px;font-size:15px;color:var(--ink);font-weight:600;max-width:78ch}
.codeblk dl,.figs.method dl{margin:14px 0 0;display:grid;grid-template-columns:210px 1fr;gap:0}
.codeblk dt,.figs.method dt{font:600 9.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);padding:14px 16px 14px 0;border-top:1px solid var(--rule)}
.codeblk dd,.figs.method dd{margin:0;padding:14px 0;border-top:1px solid var(--rule);font-size:13.5px;
  line-height:1.65;color:var(--ink2);max-width:82ch}
.codeblk dd .src,.figs.method dd .src{margin-left:6px}
@media(max-width:640px){.codeblk dl,.figs.method dl{grid-template-columns:1fr}
  .codeblk dd,.figs.method dd{padding-top:0;border-top:0}}

.codeblk h3{margin:8px 0 18px;font:700 26px/1.15 var(--sans);letter-spacing:-.03em;max-width:30ch}
.cq{margin:14px 0 0;padding:16px 0 16px 18px;border-left:2px solid var(--ink);max-width:82ch}
.cq p{margin:0;font:400 16px/1.55 var(--sans);color:var(--ink);letter-spacing:-.005em}
.cq footer{margin-top:8px;font-size:12px;color:var(--ink3)}
.cq footer .src{margin-left:8px}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px;min-width:0}
.ctab th{font:600 9px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:8px 14px 8px 0;border-bottom:1px solid var(--ink)}
.ctab td{padding:13px 14px 13px 0;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.55;color:var(--ink2)}
.ctab td.q{font-weight:600;color:var(--ink);width:19%}
.ctab td.s{width:22%;white-space:normal}
.ctab td.s .src{margin:0}
@media(max-width:640px){.ctab{min-width:560px}}

/* market figures */
.stats.mk{margin-top:26px}
.figsrc{margin:12px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.figsrc .lab{margin-right:2px}
.fig .cty{stroke:none}
.fig .ctyedge{pointer-events:none}
.fig .ctyedge path{fill:none;stroke:var(--ink3);stroke-width:.9;stroke-linejoin:round}
.fig .cty:hover{stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.fig .ctyls{pointer-events:none}
.fig .ctyl{font:600 12px var(--sans);text-anchor:middle;pointer-events:none;paint-order:stroke;letter-spacing:-.01em}
.fig .ctyv{font:500 10px var(--mono);text-anchor:middle;pointer-events:none;font-variant-numeric:tabular-nums;paint-order:stroke}
.fig .cell{stroke:#FFFFFF;stroke-width:1}
.fig .cell:hover{stroke:var(--ink);stroke-width:1.5}
.fig .rowl.sm{font-size:11.5px}
.mapwrap{display:block}
.yrctl{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.yrctl label{font:600 10px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.yrctl input[type=range]{flex:1;max-width:420px;accent-color:var(--ink)}
.yrctl output{font:600 13px var(--mono);font-variant-numeric:tabular-nums;min-width:4ch}
.mtxctl{margin:0 0 14px}
.mtxctl .seg{display:inline-flex}
.ftab.wide{width:100%;border-collapse:collapse;font-size:13px}
.ftab.wide.mt{margin-top:22px}
.ftab.wide caption{caption-side:top;text-align:left;padding:0 0 8px;
  font:600 10px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.ftab .num{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:640px){.yrctl input[type=range]{max-width:none}}
.figs{margin:46px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.figs h3{margin:0;font:700 22px/1.15 var(--sans);letter-spacing:-.025em}
.fcap{margin:8px 0 18px;max-width:78ch;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.fwrap{overflow-x:auto}
/* the map carries ten labels and two numbers each; below about 700px it stops
   being readable if it scales to the column, so it keeps a working size and
   scrolls inside its own wrapper instead. */
@media(max-width:700px){
  #mapHost .fig{min-width:560px}
  .fig .ctyl{font-size:13px!important;letter-spacing:0}
  .fig .ctyv{font-size:11px!important}
}
.fig{display:block;max-width:100%;height:auto;font-family:var(--sans)}
.fig.tl{max-width:760px}
.fig .band{fill:var(--paper3)}
.fig .band.b1{fill:var(--paper2)}
.fig .grid{stroke:var(--rule);stroke-width:1}
.fig .axis{stroke:var(--ink);stroke-width:1}
.fig .tick{stroke:var(--ink3);stroke-width:1}
.fig .now{stroke:var(--orange);stroke-width:1.5}
.fig .axt{font:500 10px var(--mono);fill:var(--ink3);text-anchor:middle}
.fig .axs,.fig .axe{font:500 10px var(--mono);fill:var(--ink3);font-variant-numeric:tabular-nums}
.fig .axs{text-anchor:start}
.fig .axe{text-anchor:end}
.fig .axl{font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;fill:var(--ink3)}
.fig .rowl{font:500 13px var(--sans);fill:var(--ink)}
.fig .rowl[data-id],.fig .node[data-id]{cursor:pointer}
.fig .rowl[data-id]:hover,.fig .node[data-id]:hover{text-decoration:underline}
.fig .val{font:600 12px var(--sans);fill:var(--ink);font-variant-numeric:tabular-nums}
.fig .val .yr{font:500 10px var(--mono);fill:var(--ink3)}
.fig .bar{fill:var(--ink)}
.fig .bar.partial{fill:var(--ink3)}

<script>
/* ------------------------------------------------------------------ ground
   Ported verbatim from the Americas rolodex (ibarzabalhec/icon-americas-rolodex,
   index.html). A procedural heightfield of six to eight anisotropic gaussians,
   traced with marching squares into topographic iso-lines, with peak drift,
   per-peak amplitude LFOs, elevation labels and an occasional gleam sweep.
   Throttled, gated on prefers-reduced-motion, and paused when the tab hides.
   Only the colour tokens it reads were changed. */
function initAtmosphere() {
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('atmos');
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');

  const state = {
    w: 0, h: 0, dpr: 1,
    mouseX: 0, mouseY: 0,
    scrollY: 0, targetScrollY: 0,
    parallaxX: 0, parallaxY: 0, targetParallaxX: 0, targetParallaxY: 0,
    // Animation state — added for the drift/gleam/label-breath layers.
    peaks: null,              // mutable peak objects (built once per resize)
    labelSlots: null,         // mutable label positions with phase offsets
    gleam: null,              // active gleam sweep (or null when idle)
    nextGleamAt: 0,           // ms timestamp when the next gleam should trigger
    lastFrame: 0,             // last RAF timestamp (for dt calc)
    lastRender: 0,            // last canvas redraw timestamp (for 15 fps throttle)
    rafId: 0,                 // live RAF handle (0 = not looping)
    animate: false,           // master flag — set by decideMode() based on gates
  };

  // Colors read once per resize / theme change (not every frame).
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const accent = (cs.getPropertyValue('--accent-warm').trim()) || '#C9A063';
    const ink    = (cs.getPropertyValue('--text-primary').trim()) || '#8a8a8a';
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    return { accent, ink, isLight };
  }

  // Stable PRNG — shapes persist across draws
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function() {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Procedural heightfield built from a few 2-D gaussians → gives real
  // topographic elevation contours when you sample at evenly-spaced levels
  // (like a USGS quad map). Each peak carries drift velocity + amplitude
  // LFO state so the field can mutate frame-to-frame.
  function buildPeaks(w, h) {
    const r = mulberry32(20260419);
    const n = 6 + Math.floor(r() * 3);        // 6-8 peaks/basins
    const peaks = [];
    for (let i = 0; i < n; i++) {
      const ampBase = (r() > 0.35 ? 1 : -0.6) * (0.55 + r() * 0.85);
      peaks.push({
        cx: (0.05 + r() * 0.9) * w,
        cy: (0.05 + r() * 0.9) * h,
        // Current (animated) amp — initialized to the LFO value at t=0, which
        // equals ampBase since sin(phase) is normalized below.
        amp: ampBase,
        ampBase,
        // Anisotropic — stretches to feel like ridgelines, not circles
        sx: (0.12 + r() * 0.22) * Math.min(w, h),
        sy: (0.10 + r() * 0.20) * Math.min(w, h),
        theta: r() * Math.PI,
        // Drift — gentle random-walk velocity in px/sec. Kept small so peaks
        // wander organically over tens of seconds rather than streaking.
        vx: (r() - 0.5) * 8,
        vy: (r() - 0.5) * 6,
        // Amplitude LFO — each peak breathes on its own period + phase so the
        // field ripples asynchronously, never pulsing in lockstep.
        ampLfoPeriodS: 25 + r() * 50,         // 25–75 seconds per cycle
        ampLfoPhase: r() * Math.PI * 2,
        ampLfoDepth: 0.12 + r() * 0.10,       // ±12–22% of ampBase
      });
    }
    return peaks;
  }
  function heightAt(x, y, peaks) {
    let z = 0;
    for (const p of peaks) {
      const dx = x - p.cx, dy = y - p.cy;
      const cs = Math.cos(p.theta), sn = Math.sin(p.theta);
      const u = (dx * cs + dy * sn) / p.sx;
      const v = (-dx * sn + dy * cs) / p.sy;
      z += p.amp * Math.exp(-(u*u + v*v) * 0.5);
    }
    // Low-amplitude, high-freq ripple for organic crispness (no wobble)
    z += 0.04 * Math.sin(x * 0.013 + y * 0.009);
    z += 0.03 * Math.cos(x * 0.007 - y * 0.017);
    return z;
  }

  // Marching-squares iso-line tracer over a coarse grid. Produces proper
  // topographic contours rather than concentric ellipses — i.e. real map
  // elevation lines that branch, close, and meander naturally.
  function drawContours(ctx, w, h, peaks, levels, colors) {
    const step = 14;                 // grid step in px — smaller = smoother
    const cols = Math.ceil(w / step) + 1;
    const rows = Math.ceil(h / step) + 1;
    const grid = new Float32Array(cols * rows);
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        grid[j * cols + i] = heightAt(i * step, j * step, peaks);
      }
    }
    function get(i, j) { return grid[j * cols + i]; }
    function lerp(a, b, t) { return a + (b - a) * t; }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    levels.forEach((level, idx) => {
      const isIndex = (idx % 5 === 0);   // every 5th contour is an "index contour"
      ctx.strokeStyle = isIndex ? colors.accent : colors.ink;
      ctx.globalAlpha = isIndex ? colors.alphaIndex : colors.alphaMinor;
      ctx.lineWidth = isIndex ? 0.9 : 0.5;
      ctx.beginPath();
      for (let j = 0; j < rows - 1; j++) {
        for (let i = 0; i < cols - 1; i++) {
          const a = get(i, j);
          const b = get(i+1, j);
          const c = get(i+1, j+1);
          const d = get(i, j+1);
          let code = 0;
          if (a > level) code |= 1;
          if (b > level) code |= 2;
          if (c > level) code |= 4;
          if (d > level) code |= 8;
          if (code === 0 || code === 15) continue;
          const x0 = i * step, y0 = j * step;
          const x1 = x0 + step, y1 = y0 + step;
          // Interpolate crossing points on each edge
          const tA = (level - a) / (b - a || 1e-9);
          const tB = (level - b) / (c - b || 1e-9);
          const tC = (level - d) / (c - d || 1e-9);
          const tD = (level - a) / (d - a || 1e-9);
          const pA = [x0 + step * tA, y0];
          const pB = [x1,             y0 + step * tB];
          const pC = [x0 + step * tC, y1];
          const pD = [x0,             y0 + step * tD];
          function seg(p, q) {
            ctx.moveTo(p[0], p[1]);
            ctx.lineTo(q[0], q[1]);
          }
          switch (code) {
            case 1:  case 14: seg(pA, pD); break;
            case 2:  case 13: seg(pA, pB); break;
            case 4:  case 11: seg(pB, pC); break;
            case 8:  case 7:  seg(pC, pD); break;
            case 3:  case 12: seg(pB, pD); break;
            case 6:  case 9:  seg(pA, pC); break;
            case 5:  seg(pA, pD); seg(pB, pC); break;
            case 10: seg(pA, pB); seg(pC, pD); break;
          }
        }
      }
      ctx.stroke();
    });
  }

  // Survey-paper grid — clean straight lines with tick marks. Subtle; intended
  // to sit under the contours like graph paper, not curved projection lobes.
  function drawGrid(ctx, w, h, colors) {
    ctx.save();
    ctx.strokeStyle = colors.ink;
    ctx.globalAlpha = colors.alphaGrid;
    ctx.lineWidth = 0.4;
    const major = 120;     // primary grid spacing
    ctx.beginPath();
    for (let x = major; x < w; x += major) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    for (let y = major; y < h; y += major) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
    // Minor grid — dotted ticks every 30px along the major lines
    ctx.globalAlpha = colors.alphaGrid * 0.45;
    ctx.beginPath();
    for (let x = 0; x < w; x += 30) { ctx.moveTo(x, 0); ctx.lineTo(x, 4); }
    for (let y = 0; y < h; y += 30) { ctx.moveTo(0, y); ctx.lineTo(4, y); }
    ctx.stroke();
    ctx.restore();
  }

  // Build 4 persistent label slots — position fixed on (re)size, but the
  // elevation number re-samples from heightAt() every frame and the opacity
  // breathes on an independent period per slot.
  function buildLabelSlots(w, h) {
    const r = mulberry32(42);
    const slots = [];
    for (let k = 0; k < 4; k++) {
      slots.push({
        x: (0.40 + r() * 0.55) * w,
        y: (0.55 + r() * 0.35) * h,
        // Breath period in seconds + phase offset so labels pulse out of sync.
        breathPeriodS: 6 + r() * 4,               // 6–10 s
        breathPhase: r() * Math.PI * 2,
      });
    }
    return slots;
  }

  // Elevation labels — values re-sampled per frame so they tick with drift,
  // opacity gently breathes so the hero feels alive without distracting.
  function drawElevationLabels(ctx, w, h, peaks, slots, colors, tSec) {
    ctx.save();
    ctx.fillStyle = colors.accent;
    ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    const base = colors.alphaLabel * 0.55;
    for (const s of slots) {
      // Breath: alpha multiplier in [0.55, 1.0] — never dims to zero, so
      // a label always stays legible but the field looks like it's breathing.
      const b = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(2 * Math.PI * tSec / s.breathPeriodS + s.breathPhase));
      ctx.globalAlpha = base * b;
      const z = heightAt(s.x, s.y, peaks);
      const elev = Math.round(1000 + z * 800);
      ctx.fillText(elev + 'm', s.x, s.y);
    }
    // Corner coordinate marker — elegant, just the survey label
    ctx.globalAlpha = colors.alphaLabel * 1.1;
    ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText('29°N  /  95°W', 24, h - 24);
    ctx.restore();
  }

  // Gleam sweep — a soft radial highlight that enters from one corner,
  // crosses the viewport, and fades. Triggered once every 45–90 s.
  function drawGleam(ctx, w, h, gleam, colors) {
    if (!gleam) return;
    // Progress is 0..1 over the whole sweep. Use a sin envelope for the alpha
    // so the highlight fades in, peaks in the middle, and fades out.
    const envelope = Math.sin(Math.PI * gleam.progress);
    if (envelope <= 0.001) return;
    // Interpolate position from start → end along the sweep vector.
    const x = gleam.x0 + (gleam.x1 - gleam.x0) * gleam.progress;
    const y = gleam.y0 + (gleam.y1 - gleam.y0) * gleam.progress;
    const radius = Math.max(w, h) * 0.55;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
    // Peak alpha is 0.35 in light mode, softer in dark to avoid a white hotspot.
    const peakA = colors.isLight ? 0.35 : 0.22;
    grad.addColorStop(0,    `rgba(201, 160, 99, ${(peakA * envelope).toFixed(3)})`);
    grad.addColorStop(0.45, `rgba(201, 160, 99, ${(peakA * envelope * 0.35).toFixed(3)})`);
    grad.addColorStop(1,    'rgba(201, 160, 99, 0)');
    ctx.save();
    ctx.globalCompositeOperation = colors.isLight ? 'multiply' : 'screen';
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  // Animation gate — disabled by prefers-reduced-motion OR by narrow viewport
  // (to save mobile battery). Re-evaluated on every resize so rotating a
  // tablet into landscape or widening a window lights the animation back up.
  function decideMode() {
    state.animate = !reduce && window.innerWidth >= 480;
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    state.dpr = dpr;
    state.w = window.innerWidth;
    state.h = window.innerHeight;
    canvas.width  = state.w * dpr;
    canvas.height = state.h * dpr;
    canvas.style.width  = state.w + 'px';
    canvas.style.height = state.h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // (Re)seed peaks + label slots for the new viewport size.
    state.peaks = buildPeaks(state.w, state.h);
    state.labelSlots = buildLabelSlots(state.w, state.h);
    decideMode();
    if (state.animate) {
      startLoop();
    } else {
      stopLoop();
      draw(0);                                   // single static render
    }
  }

  // Advance peak drift + LFOs by dt seconds. Peaks bounce off viewport edges
  // (with a small inset so centers never actually reach the border).
  function tick(dt, tSec) {
    if (!state.peaks) return;
    const insetX = 0.05 * state.w;
    const insetY = 0.05 * state.h;
    for (const p of state.peaks) {
      // Drift — gentle random-walk jitter plus damping so velocity stays bounded.

  function loop(ts) {

orty-three is the figure on record."]]}, {"name": "Black Buffalo 3D", "where": "New Jersey", "status": "bankrupt", "line": "Filed Chapter 11 on 24 December 2025.", "facts": [["What happened", "Chapter 11 on 24 December 2025. Its Texas presence was one house in Fort Worth, printed live over two days in May 2024 with Boxer Property of Houston as the development partner. No coverage after June 2024 confirms it was completed."]]}, {"name": "SQ4D", "where": "Long Island, New York", "status": "live", "line": "Four units in about six years, none in Texas.", "facts": [["Track record", "Four units built since 2017, all on Long Island. Specifications and pricing are not published."]]}, {"name": "CyBe Construction", "where": "Netherlands and Florida", "status": "live", "line": "One confirmed American house, in Florida.", "facts": [["Track record", "One named United States home, in Florida. No Texas project and no published funding."]]}], "consolidation": "Three of the twelve are gone or going: Diamond Age closed in December 2024 with fifteen houses unfinished, Black Buffalo filed Chapter 11 in December 2025, and Mighty Buildings put itself up for sale in January 2025 after raising more than $150 million.", "limits": [["The three counts", "Repetition asks whether a firm builds the same plans in one place. Printer fit asks whether one or two printers would cover a share of a year's output: roughly 25 to 400 homes a year in a few communities clears it, 400 to 1,500 or a decision that sits with a parent is partial, and national purchasing fails. Track record asks whether the firm has ever paid for a new way of building. Yes and Partly both count as holding a count. A No does not. A firm in on all three sits in the first section; one gap puts it in the second; the rest are grouped by what they are rather than by what they score."], ["The counts, read for a contractor", "A contractor does not close houses, so the same three questions are asked of the work rather than of the plan set. Repetition asks whether the firm puts up the same wall again and again inside one metro. Printer fit asks whether one or two printers would cover a share of the wall it puts up in a year, on the same bands, with a firm whose purchasing sits at a corporate desk scored Partly for the same reason a national builder is. Track record is unchanged."], ["Who decides", "45 of 90 firms have a named vice president or director of construction, or head of purchasing, and 42 of those 45 can be reached as named without a caveat. The other 3 carry a decider who has left, who is listed at a different entity, or whose match is probable rather than confirmed; the caveat sits on the contact itself. That is the bar, because those roles can change a wall specification. Construction managers, superintendents and purchasing agents are excluded: they execute a specification rather than choose one. At a contractor the specification belongs to somebody else, so the person marked is the one who signs for equipment: the owner, the president or the division head."], ["Sources", "Company filings, company pages and trade press. Every contact is either a LinkedIn profile whose headline names the firm, or a page on the firm's own site that names the person with a title, and the sentence that identified them sits under the name. No source URL, title or figure here was inferred. The only built links are the LinkedIn searches marked search, which run a keyword query rather than claim a page."], ["What is in the contractor section", "Concrete, shell and wall contractors, and the general contractors that self-perform concrete. The scope rule above is a builder rule and does not apply to them: most of this trade in Houston is commercial and industrial."], ["In the press", "Each item is a headline a search actually returned, with the outlet, the date the result carried, and a link read off the result rather than assembled. The headline is the publisher's."], ["Scope", "Greater Houston and its suburban counties. Architects, engineers and permitting authorities are not covered. Firms whose product is retail shell, mid-rise or one-off architecture are held out of the deck and kept in the workbook."], ["Figures", "Where two sources disagree, both numbers appear and the disagreement is stated. Where a figure is an average across years rather than a current run rate, it says so."]], "code": {"line": "Houston has no zoning. A printed wall is a building-code question.", "items": [{"q": "Does zoning apply?", "a": "No. Houston has no zoning. Chapter 42 governs subdivision, setbacks and parking. A masterplan's deed restrictions are where an exterior material can be refused.", "url": "https://www.houstontx.gov/planning/DevelopRegs/", "source": "City of Houston Planning, Development Regulations"}, {"q": "What code, inside the city?", "a": "2021 IRC, in force 1 January 2024. Appendix AW (3D-printed construction) is not adopted, so a printed wall enters under R104.11, alternative materials and methods, on an ICC-ES report to AC509.", "url": "https://www.houstonpermittingcenter.org/media/9056/download", "source": "Houston Amendments to the 2021 IRC"}, {"q": "Does ICON hold that report?", "a": "Yes. ESR-4652, reissued June 2026: bearing, non-bearing and shear walls to 12 feet, Seismic Design Categories A and B, special inspection required.", "url": "https://icc-es.org/wp-content/uploads/report-directory/ESR-4652.pdf", "source": "ICC-ES ESR-4652"}, {"q": "What code, in the county?", "a": "The IRC in force at the county seat (LGC 233.153), with third-party inspection at foundation, framing and completion (233.154). Harris County's seat is Houston.", "url": "https://codes.findlaw.com/tx/local-government-code/loc-gov-t-sect-233-154.html", "source": "Texas LGC 233.153, 233.154"}, {"q": "Can a city or county refuse it?", "a": "Not if a national model code approves it within three cycles. Government Code Chapter 3000, in force 1 September 2019. Exceptions: historic districts, state- or federally-funded housing.", "url": "https://www.tml.org/DocumentCenter/View/2892/HB--2439-Building-Materials-QA-Sep-2021", "source": "Texas Government Code 3000; TML Q&A"}], "precedent": [{"project": "Zuri Gardens", "where": "City of Houston, near Hobby Airport", "what": "80 printed homes. $1.8 million in TIRZ bond proceeds approved by council; HCDD infrastructure reimbursement. Sales from summer 2026.", "url": "https://houston.innovationmap.com/zuri-gardens-houston-2674387821.html", "source": "InnovationMap; Houstonia"}, {"project": "Avenue J", "where": "City of Houston, East End", "what": "One printed duplex, Elpis 3D Home Builders, printed by HiveASMBLD.", "url": "https://www.houstonchronicle.com/business/article/3d-print-affordable-houston-east-end-22153531.php", "source": "Houston Chronicle"}, {"project": "Gulf Shore Estates", "where": "Unincorporated Galveston County, San Leon", "what": "23 of 26 homes printed, Commander Home Builders, printed by HiveASMBLD.", "url": "https://www.houstonchronicle.com/business/article/houston-real-estate-3d-printed-home-hiveasmbld-20824540.php", "source": "Houston Chronicle"}], "quotes": [{"text": "The updated I-Codes include requirements for energy storage systems to help facilitate their implementation and improved construction methods for tiny homes, 3-D printing and the use of intermodal shipping containers as buildings.", "who": "International Code Council, on Houston's adoption of the 2021 codes, 25 October 2023", "url": "https://www.iccsafe.org/about/periodicals-and-newsroom/houstons-city-council-approves-adoption-of-the-2021-international-codes/", "source": "ICC newsroom"}, {"text": "The walls are intended for use as bearing walls, non-load bearing walls and shear walls with wall heights up to 12 feet (3.7 m) tall in Seismic Design Categories A or B.", "who": "ICC-ES ESR-4652, ICON 3D-Printed Concrete Wall Systems, Section 2.0, Uses; reissued June 2026", "url": "https://icc-es.org/wp-content/uploads/report-directory/ESR-4652.pdf", "source": "ICC-ES ESR-4652"}, {"text": "Section R104.11 of the 2021 International Residential Code (IRC) allows for alternative materials and methods, such as 3D-printed structures.", "who": "STRUCTURE magazine, From Nozzle to Neighborhood, on the Wolf Ranch engineering", "url": "https://www.structuremag.org/article/from-nozzle-to-neighborhood/", "source": "STRUCTURE magazine"}]}, "method": [{"title": "Counts on the page", "text": "Every count (firms screened, in on all three, named decision-maker, and the stat strips) is a count of the records behind the page, taken when the page is generated. None is estimated or rounded."}, {"title": "Yes, Partly, No", "text": "Each verdict is written per firm with its reason, from the sources on the firm's page. A Partly records partial evidence; a No records an absent record, not a finding against the firm. Yes and Partly both count as holding a count. A No does not."}, {"title": "Annual closings", "text": "Only published figures are drawn: Builder 100 firm pages, HousingWire, or the firm's own site, each named in the tooltip and the table. A range is the firm's own range. Where a figure is dated, the year is shown. The count is against the builders on the deck: a contractor closes no homes and is not drawn."}, {"title": "Machine-fit bands", "text": "The bands are an assumption, not a published figure. What is published: at Wolf Ranch one Vulcan printer and one crew took about three weeks to print a home's walls by August 2024, which is on the order of seventeen wall systems a year per printer (Engadget, 8 August 2024). ICON has published no throughput for Titan: a $20 per square foot wall target, a $5,000 deposit, training in the third quarter of 2026 and deliveries from early 2027 (ICON newsroom, 11 March 2026), and a market-opening threshold of six to ten printers in one market (Builder). The bands assume Titan runs materially faster than Vulcan did at Wolf Ranch and will be redrawn when ICON publishes a rate."}, /* ------------------------------------------------------------------ filters
   One state, read by every view. Screen dims what does not match, List and
   Cover drop it, and the applied set is shown as removable chips with a reset
   that is present whenever anything is on. Five controls: the guidance is that
   a filter bar past about seven controls stops being read, and the seventeen
   chips this replaced were only ever visible on one of the four views. */
var F={group:[],count:[],dec:''};

function inFilters(t){
  if(F.group.length&&F.group.indexOf(t.group)<0) return false;
  if(F.dec==='any'&&!t.has_decider) return false;
  if(F.dec==='ok'&&!t.decider_confirmed) return false;
  if(F.dec==='chk'&&!t.decider_caveat) return false;
  for(var i=0;i<F.count.length;i++){
    var p=F.count[i].split(':');
    if(t.marks[p[0]]!==p[1]) return false;
  }
  return true;
}
function activeFilters(){
  var out=[];
  F.group.forEach(function(g){out.push(['group:'+g,GL[g]||g]);});
  F.count.forEach(function(k){
    var p=k.split(':');out.push([ 'count:'+k, AXN[p[0]]+' '+W[p[1]] ]);});
  if(F.dec==='any') out.push(['dec','Named decision-maker']);
  if(F.dec==='ok') out.push(['dec','Named and confirmed']);
  if(F.dec==='chk') out.push(['dec','Named, needs confirming']);
  return out;
}
function clearFilters(){F={group:[],count:[],dec:''};}

var AXN={repeatability:'Repetition',machine_fit:'Printer fit',innovation:'Track record'};
var FMENU=null;

function closeMenu(){
  if(!FMENU) return;
  var o=document.querySelector('.fsel.open');
  if(o){o.classList.remove('open');var b=o.querySelector('button');if(b)b.setAttribute('aria-expanded','false');}
  var m=document.getElementById('fmenu'); if(m) m.remove();
  FMENU=null;
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.fsel')) closeMenu();
},true);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&FMENU){e.stopPropagation();closeMenu();}
},true);

/* Counts are taken against everything else currently applied, so a menu never
   offers a choice that would return nothing. */
function optionCount(kind,key){
  var save={group:F.group.slice(),count:F.count.slice(),dec:F.dec};
  if(kind==='group'){if(save.group.indexOf(key)<0) save.group=save.group.concat([key]);}
  else if(kind==='count'){if(save.count.indexOf(key)<0) save.count=save.count.concat([key]);}
  else save.dec=key;
  var keep=F;F=save;
  var n=T.filter(function(t){return inFilters(t)&&textHit(t);}).length;
  F=keep;return n;
}

function menuFor(kind,axis){
  var rows=[];
  if(kind==='group'){
    ['adopter','a','b','trade','creative','national','channel','icon'].forEach(function(g){
      if(!T.some(function(t){return t.group===g;})) return;
      rows.push(['group:'+g, GL[g]||g, F.group.indexOf(g)>=0, optionCount('group',g)]);});
  }else if(kind==='count'){
    ['clear','partial','fail'].forEach(function(m){
      var k=axis+':'+m;
      rows.push(['count:'+k, W[m], F.count.indexOf(k)>=0, optionCount('count',k)]);});
  }else{
    rows.push(['dec','Named decision-maker', F.dec==='any', optionCount('dec','any')]);
    rows.push(['dec2','Named and confirmed', F.dec==='ok', optionCount('dec','ok')]);
    rows.push(['dec3','Named, needs confirming', F.dec==='chk', optionCount('dec','chk')]);
  }
  return '<div class="fmenu" id="fmenu" role="group">'+rows.map(function(r){
    return '<button role="checkbox" aria-checked="'+r[2]+'" data-f="'+r[0]+'"'+
      (r[3]===0&&!r[2]?' disabled':'')+'><i></i>'+esc(r[1])+'<s>'+r[3]+'</s></button>';}).join('')+'</div>';
}

  var bar=defs.map(function(d){
    var n=0;
    if(d[0]==='group') n=F.group.length;

  }).join('');

     and it clears all of it in one action. */
  var act=activeFilters(), h='';

  h+=act.map(function(a){
    return '<button class="ac2" data-rm="'+a[0]+'">'+esc(a[1])+' <span>×</span></button>';}).join('');
  if(h) h+='<button class="freset" id="freset">Reset all</button>';

/* ---------------------------------------------------------------- workbook
   A real .xlsx written in the page, because the file has to stay self-contained
   and a CSV loses the column widths, the header and the text formatting that
   make a contact list usable the moment it opens. Store-only ZIP: no
   compression, which Excel accepts and which fits in ninety lines. */
var CRC=(function(){var t=[];for(var n=0;n<256;n++){var c=n;
  for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  return function(buf){var c=0xFFFFFFFF;
    for(var i=0;i<buf.length;i++)c=t[(c^buf[i])&0xFF]^(c>>>8);
    return (c^0xFFFFFFFF)>>>0;};})();
function u8(str){return new TextEncoder().encode(str);}
function zip(files){
  var parts=[],cd=[],off=0;
  files.forEach(function(f){
    var data=u8(f.data),name=u8(f.name),crc=CRC(data);
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);
    lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(8,0,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);
    ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  });
  var cdLen=cd.reduce(function(a,b){return a+b.length;},0);
  var eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,files.length,true);
  eo.setUint16(10,files.length,true);eo.setUint32(12,cdLen,true);eo.setUint32(16,off,true);
  return new Blob(parts.concat(cd,[new Uint8Array(eo.buffer)]),
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* What actually goes in the file: one row per contact, because that is the
   shape a CRM import and a call sheet both want, with the firm's screen
   repeated alongside. A firm with no named contact still gets a row, so the
   gap travels with the list rather than disappearing from it. */
var XCOLS=[['Firm',30],['Section',22],['Repetition',12],['Printer fit',11],['Track record',13],
           ['Region',24],['Headline figure',34],['Contact',22],['Title',34],['Decides the wall',15],
           ['Status',16],['LinkedIn',46],['Named on',46],['Website',34],['The screen',60]];
function exportRows(list){
  var rows=[XCOLS.map(function(c){return c[0];})];
  list.forEach(function(t){
    var base=[t.entity_name, GL[t.group]||'', W[t.marks.repeatability], W[t.marks.machine_fit],
              W[t.marks.innovation], t.region||'', t.key_stat||''];
    var ppl=(t.principals||[]).slice().sort(function(a,b){return (b.decider?1:0)-(a.decider?1:0);});
    if(!ppl.length){
      rows.push(base.concat(['','','','No contact published','','',t.homepage_url||'',t.mvp_screen||'']));
      return;}
    ppl.forEach(function(pp){
      var st=pp.departed?'Departed':(pp.entity_note?'Confirm entity':(pp.probable?'Unconfirmed':'Current'));
      rows.push(base.concat([pp.name, pp.role||'', pp.decider?'Yes':'', st,
        pp.linkedin_url||'', pp.source_url||'', t.homepage_url||'', t.mvp_screen||'']));
    });
  });
  return rows;
}
function xnote(msg){
  var note=document.getElementById('xnote');
  if(note){note.textContent=msg;note.hidden=false;}
}
function downloadXlsx(list,label){
  if(!list.length) return;
  var rows=exportRows(list);
  var blob=buildXlsx(rows,XCOLS.map(function(c){return c[1];}),'Prospects');
  var name='Houston_Prospects_'+label+'_'+(D.last_updated||'').replace(/-/g,'')+'.xlsx';
  var n=rows.length-1;
  var hosted=!!(window.claude&&typeof window.claude.use==='function');
  if(hosted){
    window.claude.use('downloads').then(function(dl){
      if(!dl){xnote('Saving is not available in this view.');return;}
      return dl.save({filename:name,data:blob}).then(function(){
        xnote(n+' rows saved as '+name);
      },function(err){
        var c=err&&err.code;
        if(c==='declined') return;
        if(c==='rate_limited') xnote('A save prompt is already open.');
        else xnote('Saving is not available in this view.');
      });
    });
    return;
  }
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
  xnote(n+' rows written to '+name);
}

var CF_SPACING=96, CF_SHIFT=180, CF_Z=110, CF_ROT=58, CF_SCALE=.82;
var cfArr=[], cfCards=[], cfFocus=0, cfFloat=0, cfRaf=null;

function coverNameLines(name){
  var primary=name.split(/[\u2014\u00b7\/]/)[0].trim(), w=primary.split(/\s+/);
  if(w.length<=2) return [primary.toUpperCase()];
  if(w.length<=4){var m=Math.ceil(w.length/2);
    return [w.slice(0,m).join(' ').toUpperCase(), w.slice(m).join(' ').toUpperCase()];}
  var t=Math.ceil(w.length/3);
  return [w.slice(0,t).join(' ').toUpperCase(), w.slice(t,2*t).join(' ').toUpperCase(),
          w.slice(2*t).join(' ').toUpperCase()];
}
function coverNameSize(lines){
  var m=Math.max.apply(null,lines.map(function(l){return l.length;}));
  if(m<=10) return 28; if(m<=14) return 23; if(m<=18) return 19; if(m<=22) return 16; return 14;
}
function host(u){return u?u.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,''):'';}

function buildCover(t,idx){
  var el=document.createElement('div');
  el.className='cf-card i-'+t.marks.innovation+(t.group==='adopter'?' adopter':'');
  el.dataset.idx=idx; el.dataset.id=t.target_id;
  el.setAttribute('tabindex','-1'); el.setAttribute('role','button');
  el.setAttribute('aria-label',t.entity_name+'. '+(D.group_labels[t.group]||'')+'. Open firm.');
  var lines=coverNameLines(t.entity_name), sz=coverNameSize(lines);
  var counts=[['repeatability','Repetition','m1'],['machine_fit','Printer fit','m3'],['innovation','Track record','m2']]
    .map(function(a){return '<span class="'+a[2]+' '+t.marks[a[0]]+'">'+a[1]+' '+W[t.marks[a[0]]]+'</span>';}).join('');
  var face='<span class="pip"></span>'+
    '<div class="t-row"><span>'+esc(t.region||'')+'</span></div>'+
    '<div class="cname" style="font-size:'+sz+'px">'+lines.map(esc).join('<br>')+'</div>'+
    '<div class="csyn">'+esc((t.mvp_screen||'').slice(0,118))+'</div>'+
    '<div class="crow">'+counts+'</div>';
  el.innerHTML='<div class="tile">'+face+'</div>'+
    '<div class="reflection"><div class="tile">'+face+'</div></div>';
  return el;
}
function applyCoverTransforms(){
  var cx=cfFloat, n=cfCards.length;
  var dragging=document.getElementById('cfStage').classList.contains('dragging');
  for(var i=0;i<n;i++){
    var el=cfCards[i], d=i-cx, abs=Math.abs(d);
    if(abs>6){el.style.display='none';continue;}
    el.style.display='';
    var sgn=d===0?0:(d>0?1:-1);
    var x=d*CF_SPACING+sgn*Math.min(abs,1)*CF_SHIFT;
    var rot=sgn*-CF_ROT*Math.min(abs,1);
    var z=-Math.min(abs,4)*CF_Z;
    var scale=Math.max(.55,1-Math.min(abs,3)*(1-CF_SCALE));
    el.style.transform='translate3d('+x+'px,0,'+z+'px) rotateY('+rot+'deg) scale('+scale+')';
    el.style.opacity=abs>4?Math.max(0,1-(abs-4)*.5):1;
    el.style.zIndex=String(1000-Math.round(abs*10));
    el.style.filter=(dragging||abs<=1.2)?'':
      'brightness('+(0.92+Math.max(0,1.6-abs)*0.05)+') saturate(.6)';
  }
}
function updateCfTitle(){
  var t=cfArr[Math.max(0,Math.min(cfArr.length-1,Math.round(cfFloat)))];
  if(!t){document.getElementById('cfTitle').innerHTML='';return;}
  var hot=t.marks.innovation==='clear';
  document.getElementById('cfTitle').innerHTML=
    '<div class="name">'+esc(t.entity_name)+'</div>'+
    '<div class="meta">'+esc(D.group_labels[t.group]||'')+' &middot; '+esc(t.region||'')+
      (t.key_stat?' &middot; '+esc(t.key_stat):'')+'</div>'+
    '<div class="badge2'+(hot?' o':'')+'">'+
      (hot?'Has paid for a new method before':(t.has_decider?'Decision-maker named':'No decision-maker named'))+'</div>';
  document.getElementById('cfCount').textContent=
    (Math.max(0,Math.min(cfArr.length-1,Math.round(cfFloat)))+1)+' of '+cfArr.length;
  cfCards.forEach(function(c,i){c.setAttribute('tabindex',i===cfFocus?'0':'-1');});
}
function updateScrub(){
  var pos=document.getElementById('cfPos');
  if(!pos) return;
  var pct=cfArr.length<=1?0:cfFloat/(cfArr.length-1);
  pos.style.left=(pct*100)+'%';
}
function reducedMotion(){
  return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
function startEase(){
  if(reducedMotion()){cfFloat=cfFocus;applyCoverTransforms();updateCfTitle();updateScrub();return;}
  if(cfRaf) return;
  var tick=function(){
    cfRaf=null;
    var diff=cfFocus-cfFloat;
    if(Math.abs(diff)<0.003){cfFloat=cfFocus;applyCoverTransforms();updateCfTitle();updateScrub();return;}
    cfFloat+=diff*0.16;               // the iPod ease
    applyCoverTransforms();updateCfTitle();updateScrub();
    cfRaf=requestAnimationFrame(tick);
  };
  cfRaf=requestAnimationFrame(tick);
}
function drawScroll(){
  cfArr=T.filter(hit);
  var scene=document.getElementById('cfScene');
  scene.innerHTML='';
  if(!cfArr.length){
    document.getElementById('cfTitle').innerHTML='<div class="meta">No firm matches the filters applied.</div>';
    document.getElementById('cfCount').textContent='0 of 0';cfCards=[];return;}
  if(cfFocus>=cfArr.length) cfFocus=0;
  cfFloat=cfFocus;
  cfCards=cfArr.map(buildCover);
  cfCards.forEach(function(n){scene.appendChild(n);});
  if(cfCards[cfFocus]) cfCards[cfFocus].setAttribute('tabindex','0');
  applyCoverTransforms();updateCfTitle();updateScrub();
}
function cfStep(k,focusCard){
  if(!cfArr.length) return;
  cfFocus=Math.max(0,Math.min(cfArr.length-1,cfFocus+k));
  startEase();
  if(focusCard&&cfCards[cfFocus]) cfCards[cfFocus].focus();
}

function render(){

  else if(mode==='list') drawList();

  else if(mode==='market') drawMarket();

  document.getElementById('stageMatrix').hidden=(mode!=='matrix');
  document.getElementById('stageList').hidden=(mode!=='list');
  document.getElementById('stageField').hidden=(mode!=='field');
  document.getElementById('stageMarket').hidden=(mode!=='market');
