<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rolodex Intro</title>
<style>
/*__FONTS__*/
:root{--paper:#FFFFFF;--ink:#111111}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:manipulation;cursor:pointer}
.ctl{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.ctl.on{opacity:1;pointer-events:auto}
.ctl button{font:600 12px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);background:var(--paper);border:1px solid var(--ink);border-radius:2px;padding:0 14px;height:40px;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ctl button:active{transform:translateY(1px)}
.ctl button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<canvas id="cv" aria-label="Rolodex intro"></canvas>
<div class="ctl" id="ctl">
  <button id="slow" aria-pressed="false" title="Play at half speed">Half speed</button>
  <button id="replay" title="Play again">Replay</button>
</div>
<script>
/*__REEL__*/
</script>
<script>
/* The standalone reel, for testing and for video. The page plays the same reel
   from the same code (_reel.js); this file only adds replay and half speed. */
(function(){
"use strict";
const D = __DATA__;
const cv = document.getElementById('cv'), ctl = document.getElementById('ctl');
const bReplay = document.getElementById('replay'), bSlow = document.getElementById('slow');
cv.setAttribute('aria-label', 'Rolodex intro: ' + D.title.join(' '));
const R = RolodexReel(cv, D, {colors: {acc: D.accent}});
let speed = 1, ready = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){ ctl.classList.remove('on'); R.play(speed, () => ctl.classList.add('on')); }
function finish(){ R.finish(); ctl.classList.add('on'); }
cv.addEventListener('click', () => { if (ready) R.playing ? finish() : play(); });
addEventListener('keydown', e => { if (!ready) return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); R.playing ? finish() : play(); } });
bReplay.addEventListener('click', play);
bSlow.addEventListener('click', () => { speed = speed === 1 ? .5 : 1; bSlow.setAttribute('aria-pressed', String(speed !== 1)); play(); });
addEventListener('resize', () => R.resize());
/* for frame capture: renderAt(t) draws one frame and stops playback */
window.renderAt = t => R.renderAt(t);
window.introReady = R.ready.then(() => {
  ready = true;
  if (reduce || /[?&]still\b/.test(location.search)){ finish(); bReplay.textContent = 'Play'; }
  else if (!/[?&]capture\b/.test(location.search)) play();
});
})();
</script>
</body>
</html>
