function render(){
  if(mode==='matrix') drawMatrix();
  else if(mode==='list') drawList();
  else if(mode==='scroll') drawScroll();
  else if(mode==='market') drawMarket();
  else drawField();
  document.getElementById('stageMatrix').hidden=(mode!=='matrix');
  document.getElementById('stageList').hidden=(mode!=='list');
  document.getElementById('stageField').hidden=(mode!=='field');
  document.getElementById('stageMarket').hidden=(mode!=='market');
  document.getElementById('vMarket').setAttribute('aria-pressed',mode==='market');
  // the contour field sits behind the screen. Nothing else needs it painting.
  var at=document.getElementById('atmos');
  at.style.opacity=(mode==='matrix'&&view==='index')?'':'0';
  at.dataset.idle=(mode==='matrix'&&view==='index')?'':'1';
  document.getElementById('stageScroll').hidden=(mode!=='scroll');
  document.getElementById('vScroll').setAttribute('aria-pressed',mode==='scroll');
  // one bar, on every view that lists firms
  document.getElementById('filters').hidden=(mode==='field'||mode==='market');
  if(mode!=='field') drawFilterBar();
  document.getElementById('legend').hidden=(mode==='field'||mode==='market'||
    (mode==='scroll'&&window.matchMedia('(max-width:640px)').matches));
  // Search reads firm, person and project records. The field section is prose
  // about competitors, so the box would look live and do nothing.
  var qb=document.getElementById('q');
  qb.disabled=(mode==='field'||mode==='market');
  qb.placeholder=qb.disabled?'Search does not apply here':'Search firm, person, project';
  // the masthead belongs to the screen. The working views start at the tool.
  // The masthead frames the screen. On the working views it is 400px of scroll
  // between the reader and the data.
  document.querySelector('header.top').hidden=(mode!=='matrix');
  document.getElementById('vMatrix').setAttribute('aria-pressed',mode==='matrix');
  document.getElementById('vList').setAttribute('aria-pressed',mode==='list');
  document.getElementById('vField').setAttribute('aria-pressed',mode==='field');
  document.getElementById('clN').textContent=call.length;
  document.getElementById('openCall').classList.toggle('on',call.length>0);
  drawPrintRoster();
}

/* What comes out of the printer. The screen views are interactive and would
   print as a grid of buttons, so the roster is composed once for paper and
   carries whatever filter is currently applied. */
function drawPrintRoster(){
  var h='',shown=0;
  ['adopter','a','b','trade','creative','national','channel','icon'].forEach(function(k){
    var rows=T.filter(function(t){return t.group===k&&hit(t);});
    if(!rows.length) return;
    shown+=rows.length;
    h+='<tr class="grp"><td colspan="6">'+esc(GL[k]||'')+' &middot; '+rows.length+
       (GN[k]?' &middot; '+esc(GN[k]):'')+'</td></tr>';
    rows.forEach(function(t){
      var who=(t.principals||[]).filter(function(p){return p.decider;})
        .map(function(p){return p.name+', '+p.role;}).join('; ');
      h+='<tr><td><b>'+esc(t.entity_name)+'</b><br>'+esc(t.region||'')+'</td>'+
        '<td class="m">'+W[t.marks.repeatability]+'</td>'+
        '<td class="m">'+W[t.marks.machine_fit]+'</td>'+
        '<td class="m">'+W[t.marks.innovation]+'</td>'+
        '<td>'+esc(who||'')+'</td>'+
        '<td>'+esc(t.key_stat||'')+'</td></tr>';
    });
  });
  document.getElementById('printRoster').innerHTML=
    '<table><thead><tr><th>Firm</th><th>Repetition</th><th>Printer fit</th>'+
    '<th>Track record</th><th>Decision-maker</th><th>Headline figure</th></tr></thead>'+
    '<tbody>'+(h||'<tr><td colspan="6">No firms match the current filter.</td></tr>')+'</tbody></table>'+
    '<p style="margin-top:14px;font-size:8pt;color:#555">'+shown+' of '+T.length+
    ' firms shown. Yes and Partly both count as holding a count. A No does not. '+esc(D.byline||'')+'</p>';
}

document.addEventListener('click',function(e){
  var el=e.target;
  if(el.closest('#home')){e.preventDefault();goIndex();return;}
  if(el.closest('#back')){goIndex();return;}
  if(el.id==='clPrint'){window.print();return;}
  if(el.id==='clXlsx'){downloadXlsx(call.map(function(i){return byId[i];}),'call_list');return;}
  if(el.id==='fxlsx'){downloadXlsx(T.filter(hit),
    activeFilters().length||q?'filtered':'all');return;}
  if(el.id==='clClear'){call=[];saveCall();render();openCall();return;}
  if(el.closest('#openCall')){openCall();return;}
  if(el.id==='vMatrix'){mode='matrix';goIndex();render();return;}
  if(el.id==='vList'){mode='list';goIndex();render();return;}
  if(el.id==='vField'||el.id==='toField'){mode='field';goIndex();render();return;}
  if(el.id==='vScroll'){mode='scroll';goIndex();render();return;}
  if(el.id==='vMarket'){mode='market';goIndex();render();return;}
  if(el.id==='freset'||el.closest('#freset')){clearFilters();q='';
    var qq=document.getElementById('q'); if(qq) qq.value='';
    render();return;}
  var rm=el.closest('[data-rm]');
  if(rm){var r=rm.dataset.rm;
    if(r==='q'){q='';document.getElementById('q').value='';}
    else if(r==='dec') F.dec='';
    else{var pp=r.split(':'),ar=F[pp[0]],kk=r.slice(pp[0].length+1),ix=ar.indexOf(kk);
      if(ix>=0) ar.splice(ix,1);}
    render();return;}
  var trig=el.closest('.fsel > button');
  if(trig){
    var sel=trig.parentNode, wasOpen=sel.classList.contains('open');
    closeMenu();
    if(!wasOpen){
      sel.classList.add('open');trig.setAttribute('aria-expanded','true');
      sel.insertAdjacentHTML('beforeend',menuFor(sel.dataset.kind,sel.dataset.axis));
      FMENU=sel;
      var first=sel.querySelector('.fmenu button:not([disabled])'); if(first) first.focus();
    }
    return;}
  var fb=el.closest('[data-f]');
  if(fb){var v=fb.dataset.f;
    if(v==='dec') F.dec=(F.dec==='any'?'':'any');
    else if(v==='dec2') F.dec=(F.dec==='ok'?'':'ok');
    else if(v==='dec3') F.dec=(F.dec==='chk'?'':'chk');
    else{var p=v.split(':'),arr=F[p[0]],key=v.slice(p[0].length+1),i=arr.indexOf(key);
      if(i>=0) arr.splice(i,1); else arr.push(key);}
    var host=fb.closest('.fsel');
    render();
    if(host){ // keep the menu open so several values can be picked in one go
      var again=document.querySelector('.fsel[data-kind="'+host.dataset.kind+
        '"][data-axis="'+host.dataset.axis+'"]');
      if(again){again.classList.add('open');
        again.querySelector('button').setAttribute('aria-expanded','true');
        again.insertAdjacentHTML('beforeend',menuFor(again.dataset.kind,again.dataset.axis));
        FMENU=again;}
    }
    return;}
  if(el.closest('#cfPrev')){cfStep(-1);return;}
  if(el.closest('#cfNext')){cfStep(1);return;}
  var many=el.closest('[data-addmany]');
  if(many){var list=many.dataset.addmany.split(','),
      every=list.every(function(x){return call.indexOf(x)>=0;});
    list.forEach(function(x){var j=call.indexOf(x);
      if(every){if(j>=0) call.splice(j,1);} else if(j<0) call.push(x);});
    saveCall();render();return;}
  var ad=el.closest('[data-add]');
  if(ad){var id=ad.dataset.add,i=call.indexOf(id);
    if(i>=0) call.splice(i,1); else call.push(id);
    saveCall();
    if(ad.classList.contains('rowadd')){render();return;}
    render(); if(viewing==='__call') openCall(); else openFirm(id); return;}
  var sg=el.closest('[data-seg]');
  if(sg){showSegment(sg.dataset.seg);return;}
  if(el.id==='segClose'){var sb=document.getElementById('segList');if(sb){sb.hidden=true;} SEG_OPEN=null;
    document.querySelectorAll('.fig .seg.on').forEach(function(e){e.classList.remove('on');});return;}
  var sl=el.closest('[data-seglist]');
  if(sl){var pp=sl.dataset.seglist.split(':');clearFilters();F.group=[pp[0]];F.count=['innovation:'+pp[1]];
    mode='list';goIndex();render();return;}
  if(el.closest('.cf-card')) return;   // the carousel owns its own taps
  var c=el.closest('[data-id]'); if(c&&c.dataset.id&&byId[c.dataset.id]){openFirm(c.dataset.id);return;}
  var f=el.closest('.fbtn2[data-id]'); if(f){openFirm(f.dataset.id);return;}
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&view==='firm'){goIndex();return;}
  var ae=document.activeElement, typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
  if((e.key==='Enter'||e.key===' ')&&ae&&ae.dataset&&ae.dataset.seg){e.preventDefault();showSegment(ae.dataset.seg);return;}
  if(mode==='scroll'&&view==='index'&&!typing&&(e.key==='Enter'||e.key===' ')){
    var fc=cfArr[cfFocus]; if(fc){e.preventDefault();openFirm(fc.target_id);return;}
  }
  if(e.key.slice(0,5)!=='Arrow') return;
  if(mode==='scroll'&&view==='index'&&!typing){
    var onCard=ae&&ae.classList&&ae.classList.contains('cf-card');
    if(e.key==='ArrowRight'){e.preventDefault();cfStep(1,onCard);return;}
    if(e.key==='ArrowLeft'){e.preventDefault();cfStep(-1,onCard);return;}
  }
  var act=document.activeElement;
  if(!act||!act.classList.contains('chip')) return;
  var cells=[].slice.call(document.querySelectorAll('#matrix .cell'));
  var cell=act.closest('.cell'),ci=cells.indexOf(cell);
  var chips=[].slice.call(cell.querySelectorAll('.chip')),pi=chips.indexOf(act),next=null;
  if(e.key==='ArrowRight') next=chips[pi+1]||firstChip(cells,ci+1,1);
  else if(e.key==='ArrowLeft') next=chips[pi-1]||lastChip(cells,ci-1,-1);
  else if(e.key==='ArrowDown') next=firstChip(cells,ci+3,3);
  else if(e.key==='ArrowUp') next=firstChip(cells,ci-3,-3);
  if(next){e.preventDefault();next.focus();}
});
function firstChip(cells,i,step){
  for(;i>=0&&i<cells.length;i+=step){var c=cells[i].querySelector('.chip'); if(c) return c;}
  return null;}
function lastChip(cells,i,step){
  for(;i>=0&&i<cells.length;i+=step){var c=cells[i].querySelectorAll('.chip'); if(c.length) return c[c.length-1];}
  return null;}

/* Cover-flow input. Horizontal wheel and trackpad only, so vertical scroll
   still moves the page. Drag is discriminated from a tap by distance and
   direction: under six pixels is a tap, a predominantly vertical move is
   released back to the browser. Ported from the Americas deck. */
(function(){
  var stage=document.getElementById('cfStage');
  var wheelAccum=0,wheelTimer=null;
  stage.addEventListener('wheel',function(e){
    if(mode!=='scroll') return;
    var horizontal=Math.abs(e.deltaX)>Math.abs(e.deltaY)+2;
    if(!horizontal&&!e.shiftKey) return;
    e.preventDefault();
    wheelAccum+=(horizontal?e.deltaX:e.deltaY)*0.003;
    if(Math.abs(wheelAccum)>=1){
      var steps=Math.trunc(wheelAccum);
      cfFocus=Math.max(0,Math.min(cfArr.length-1,cfFocus+steps));
      wheelAccum-=steps;startEase();
    }
    clearTimeout(wheelTimer);wheelTimer=setTimeout(function(){wheelAccum=0;},160);
  },{passive:false});

  var startX=0,startY=0,startFocus=0,pid=null,didDrag=false,captured=false,downAt=0,decided=false;
  var dragRaf=null;
  var pxPerStep=120,TAP_PX=6,DIR_PX=10,TAP_MS=350;
  stage.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0) return;
