<script>
/* Build 67. The theme is settled before first paint: the reader's own choice if
   one is stored on this device, otherwise the system setting, which it then
   follows live. */
(function(){var d=document.documentElement,K='rolodex-theme',t=null;
  /* Build 68. Which market, settled before paint so the accent is right on the
     first frame: the address says, else the last one opened here, else Houston. */
  var mk=null,h=(location.hash||'').match(/market=(houston|dfw)/);
  if(h) mk=h[1]; else {try{mk=localStorage.getItem('rolodex-market')}catch(e){}}
  d.setAttribute('data-market',mk==='dfw'?'dfw':'houston');
  try{t=localStorage.getItem(K)}catch(e){}
  var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  d.setAttribute('data-theme',t||(mq&&mq.matches?'dark':'light'));
  if(mq&&mq.addEventListener)mq.addEventListener('change',function(e){
    var s=null;try{s=localStorage.getItem(K)}catch(x){}
    if(!s)d.setAttribute('data-theme',e.matches?'dark':'light');});
  /* The intro reel plays first: once a browser session, never with reduced
     motion. ?intro=1 plays it again, ?intro=0 leaves it off. Decided here so
     the first frame is the reel's, not a flash of the page under it. */
  try{var qs=location.search||'',seen=false,
    rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try{seen=sessionStorage.getItem('rolodex-reel')==='1'}catch(x){}
    if(/[?&]intro=1\b/.test(qs)||(!/[?&]intro=0\b/.test(qs)&&!rm&&!seen))d.classList.add('reel');}catch(x){}
})();
</script>
<title>Rolodex · Greater Houston and Dallas-Fort Worth</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23FF4F00%22/%3E%3Crect x=%228%22 y=%229%22 width=%2216%22 height=%223%22 fill=%22%23000%22/%3E%3Crect x=%228%22 y=%2215%22 width=%2216%22 height=%223%22 fill=%22%23000%22/%3E%3Crect x=%228%22 y=%2221%22 width=%2216%22 height=%223%22 fill=%22%23000%22/%3E%3C/svg%3E">
<style>
/* Archivo (variable, 400-800) and IBM Plex Mono, latin subset, embedded so the
   file reads the same from disk, offline and in the hosted viewer. */
__FONTS__
/* ------------------------------------------------------------------ tokens
   Read off iconbuild.com: white ground, near-black ink, neutral concrete
   greys, one orange. The site's display face is ICON's proprietary
   Lightspeed, substituted here with the closest available grotesk. Large
   tight display type, hairline rules, solid pill tags and a circled arrow
   are the four devices the site actually uses.                            */
:root{
  --paper:#FFFFFF; --paper2:#FAFAFA; --paper3:#F2F2F2;
  --ink:#111111; --ink2:#3D3D3D; --ink3:#6B6B6B; --ink4:#767676;
  --rule:#E4E4E4; --rule2:#CFCFCF;
  --orange:#FF4F00;
  /* aliases the ported Americas atmosphere reads */
  --accent-warm:#FF4F00; --text-primary:#111111;
  /* Build 67. What sits on an ink fill, on an orange fill, and the rgb of the
     grain and the shadows, so a theme can turn them over. */
  --on-ink:#FFFFFF; --on-orange:#111111; --on-ink-dim:rgba(255,255,255,.72);
  --on-ink-rule:rgba(255,255,255,.35); --nav-bg:rgba(255,255,255,.97);
  --shade:17,17,17; --grain:17,17,17; --li:#0A66C2;
  color-scheme:light;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* Build 68. Each market carries its own accent. Houston is ICON orange; Dallas-Fort
   Worth is Dallas blue. The accent keeps its one meaning in both, and the text on
   it is whichever of ink or paper reads at 4.5:1 or better. */
:root[data-market="dfw"]{--orange:#0A3A8C; --accent-warm:#0A3A8C; --on-orange:#FFFFFF}
@media (prefers-color-scheme: dark){
  :root[data-market="dfw"]:not([data-theme="light"]){--orange:#5E9BFF; --accent-warm:#5E9BFF; --on-orange:#0F1012}
}
:root[data-market="dfw"][data-theme="dark"]{--orange:#5E9BFF; --accent-warm:#5E9BFF; --on-orange:#0F1012}
/* Build 67. Dark theme. The page follows the system setting unless the reader
   picks one with the toggle in the bar, which is remembered on this device. The
   orange keeps its one meaning and keeps dark text on it in both themes. Print is
   always the light theme. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1012; --paper2:#15161A; --paper3:#1D1F23;
    --ink:#ECECEC; --ink2:#C9C9C9; --ink3:#9D9D9D; --ink4:#909090;
    --rule:#2A2C31; --rule2:#3D4046;
    --text-primary:#ECECEC;
    --on-ink:#0F1012; --on-ink-dim:rgba(15,16,18,.72); --on-ink-rule:rgba(15,16,18,.35);
    --nav-bg:rgba(15,16,18,.95); --shade:0,0,0; --grain:255,255,255; --li:#3B8EDB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1012; --paper2:#15161A; --paper3:#1D1F23;
  --ink:#ECECEC; --ink2:#C9C9C9; --ink3:#9D9D9D; --ink4:#909090;
  --rule:#2A2C31; --rule2:#3D4046;
  --text-primary:#ECECEC;
  --on-ink:#0F1012; --on-ink-dim:rgba(15,16,18,.72); --on-ink-rule:rgba(15,16,18,.35);
  --nav-bg:rgba(15,16,18,.95); --shade:0,0,0; --grain:255,255,255; --li:#3B8EDB;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* Selected text came up in the browser's default blue, which is the one colour
   on this page nobody chose. Ink on orange reads at 5.7:1; white on orange is
   3.3:1 and fails, which is why the highlight keeps the dark text. */
::selection{background:var(--orange);color:var(--on-orange)}
::-moz-selection{background:var(--orange);color:var(--on-orange)}
[hidden]{display:none!important}
/* The ground. A grain dot, a masked grid and three soft washes that drift on a
   slow loop. Same device as the Americas deck, translated to the light palette:
   at these opacities it reads as paper rather than as decoration. */
.bg{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;background:var(--paper)}
.bg .grain{position:absolute;inset:0;
  background-image:radial-gradient(rgba(var(--grain),.055) 1px, transparent 1px);
  background-size:3px 3px}
#atmos{position:fixed;top:-20px;left:-20px;width:calc(100vw + 40px);height:calc(100vh + 40px);
  z-index:-1;pointer-events:none;opacity:1;transition:opacity 400ms ease;will-change:transform}
@media print{.bg,#atmos{display:none}}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 16px}}

/* ------------------------------------------------------------------- type */
.disp{font-weight:800;letter-spacing:-.04em;line-height:.94;text-wrap:balance}
.lab{font:700 12px/1.35 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.mono{font-family:var(--mono)}

/* -------------------------------------------------------------------- nav */
/* The wordmark sits on solid paper. At .88 the contour field behind it ghosts
   through, which reads as a rendering fault rather than a decision. */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--nav-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--ink)}
.navin{display:flex;align-items:center;gap:14px;height:56px;flex-wrap:wrap}
.navtools{display:flex;align-items:center;gap:14px;flex:0 0 auto;min-width:0}
.mark{display:flex;align-items:baseline;gap:9px;font:700 17px/1 var(--sans);letter-spacing:-.02em}
.mark i{display:block;width:5px;height:5px;border-radius:50%;background:var(--orange);
  transform:translateY(-7px)}
.mark span{font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.navsp{flex:1}
#q{font:400 13px/1 var(--sans);color:var(--ink);background:var(--paper3);border:0;
  border-radius:2px;padding:9px 11px;width:230px;outline:none}
#q::placeholder{color:var(--ink3)}
#q:focus{box-shadow:inset 0 0 0 1px var(--ink)}
.seg{display:flex;border:1px solid var(--rule2);border-radius:2px;overflow:hidden}
.seg button{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:9px 12px;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.seg button[aria-pressed="true"]:focus-visible{outline-color:var(--on-ink)}
.cbtn{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--ink);border-radius:2px;padding:9px 12px;display:flex;gap:8px;align-items:center}
.cbtn b{font:700 10px/1 var(--mono)}
.cbtn.on{background:var(--ink);color:var(--on-ink)}
.mktsw{display:inline-flex;margin:0 0 18px;max-width:100%}
.mktsw button{padding:10px 14px;white-space:nowrap}
@media(max-width:420px){.mktsw button{padding:10px 10px;letter-spacing:.06em}}
@media print{.mktsw{display:none}}
.thm{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--rule2);border-radius:2px;color:var(--ink)}
.thm:hover{border-color:var(--ink)}
@media print{.thm{display:none}}
@media(max-width:560px){.mark span{display:none}}
/* Below this the view buttons no longer fit beside the search box. They get
   their own row rather than being crushed to a hairline by overflow:hidden.
   Build 77: the line was at 760px, and from there up to about 1030px the call
   list button wrapped under a 56px nav and sat over the page. Tablets in both
   orientations were inside that band. */
@media(max-width:1060px){
  .navin{height:auto;padding-block:10px;gap:10px;row-gap:10px}
  .navtools{order:5;flex:1 0 100%;gap:10px}
  #q{flex:1 1 auto;width:auto;min-width:0}
  .seg{flex:0 0 auto}
  .seg button{padding:9px 10px;letter-spacing:.06em}
}
@media(max-width:460px){
  .navtools{flex-wrap:wrap}
  #q{flex:1 0 100%}
  .seg{flex:1 0 100%}
  .seg button{flex:1;padding:10px 4px;letter-spacing:.04em}
  .cbtn{padding:9px 10px}
}

/* ------------------------------------------------------------------ header */
header.top{padding:56px 0 30px}
/* The masthead's second half was empty at every width above a tablet. It now
   carries the second count, drawn: every firm with a published annual figure,
   placed against the machine-fit bands. The same figure lives in full on the
   Market view; here it is the signature. */
.hero-grid{display:grid;grid-template-columns:1fr;gap:34px}
.hero-fig{margin:6px 0 0;min-width:0;max-width:1040px}
.hero-fig svg{display:block;width:100%;height:auto;overflow:visible}
.hero-fig .hband{fill:var(--paper3)}
.hero-fig .hband.b1{fill:var(--paper2)}
.hero-fig .hgrid{stroke:var(--rule);stroke-width:1}
.hero-fig .hbase{stroke:var(--ink);stroke-width:1}
.hero-fig .hax{font:500 10px var(--mono);fill:var(--ink3);text-anchor:middle}
.hero-fig .hlab{font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;fill:var(--ink3)}
.hero-fig .hdot{fill:var(--ink);stroke:var(--paper);stroke-width:2;paint-order:stroke;cursor:pointer}
.hero-fig .hdot.partial{fill:var(--ink3)}
.hero-fig .hdot.fail{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.hero-fig .hdot:hover{fill:var(--ink2)}
.hero-fig .hname{font:600 12px var(--sans);fill:var(--ink)}
.hero-fig .hname.sub{fill:var(--ink3);font-weight:500}
.hero-fig .hcap{font:500 12px/1.5 var(--sans);fill:var(--ink3)}
.hero-fig .hcap a{fill:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.hero-fig .rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.hero-fig .rise{animation:none}}
@media print{.hero-fig{display:none}}
/* Build 74. Motion, taken from the machine. A printer lays a wall as one bead
   of material per layer, and each pass runs the other way from the one before.
   The page uses that bead once, as the opener, and then as the one cue for a
   change of step: a new view or a firm page arrives with a bead drawn across
   its top edge and its first blocks set down one layer at a time. Nothing
   waits on an observer, every rest state is fully visible, and reduced motion
   turns all of it off. */
.hero-copy{position:relative}
.pbead{position:absolute;height:3px;border-radius:2px;background:var(--orange);pointer-events:none;
  transform-origin:left center;z-index:2}
.pbead::after{content:"";position:absolute;top:-2.5px;width:8px;height:8px;border-radius:50%;
  background:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 22%,transparent)}
.pbead.ltr::after{right:-4px}
.pbead.rtl::after{left:-4px}
.pbead.done{transition:opacity .45s ease;opacity:0}
.pbead.done::after{display:none}
.lyr{position:absolute;right:0;top:0;font:600 10px/1 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);font-variant-numeric:tabular-nums;transition:opacity .4s ease}
.lyr b{color:var(--orange);font-weight:700}
.pre{opacity:0;transform:translateY(8px)}
.post{transition:opacity .42s ease,transform .42s cubic-bezier(.2,.7,.2,1)}
/* the view switcher carries the bead under whichever view is on */
.seg.views{position:relative}
.vbead{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--orange);pointer-events:none;
  transition:transform .34s cubic-bezier(.3,.6,.2,1),width .34s cubic-bezier(.3,.6,.2,1)}
/* a change of step */
.sbead{height:2px;margin-bottom:-2px;background:var(--orange);transform-origin:left center;
  animation:beadrun .42s cubic-bezier(.3,.6,.2,1) both,beadfade .5s .5s ease forwards;pointer-events:none}
.layerin{animation:layerup .38s cubic-bezier(.2,.7,.2,1) both}
@keyframes beadrun{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes beadfade{to{opacity:0}}
@keyframes layerup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .sbead,.pbead,.lyr{display:none}
  .layerin{animation:none}
  .vbead{transition:none}
  .pre{opacity:1;transform:none}
}
@media print{.sbead,.pbead,.lyr,.vbead{display:none}}
@media(max-width:640px){.lyr{display:none}}
/* Build 75. Weight. The page is dense, so every action answers with a small
   physical response in the market's accent: a press that sinks a pixel, a row
   that marks where you came back to, a call-list count that jumps, a filter
   count that ticks, and a scroll line with a print head that steps at each
   section. The dot in the wordmark beats once for every action, so the eye
   learns one signal. Reduced motion keeps the marks and drops the motion. */
.seg button:active,.cbtn:active,.thm:active,.rowadd:active,.addbtn:active,.grpadd:active,
button.stat:active,.fsel>button:active,.fmenu button:active,.freset:active,.back:active,
.chip:active,.lnk:active,.mktsw button:active{transform:translateY(1px) scale(.985)}
.rowadd:active,.addbtn:active{background:color-mix(in srgb,var(--orange) 16%,var(--paper))}
.rowadd.on:active,.addbtn.on:active{background:var(--ink)}
/* Build 77. The row under the pointer is where the eye is, so it lifts out of
   the list: a ground tinted in the market's accent, a rail on its left edge, the
   name underlined in the accent and nudged a few pixels in, the figure brought
   up to full ink and the + outlined. The whole row opens the firm, so the
   target is as large as the highlight. The ground and the rail stay with
   reduced motion; the nudge does not. */
#stageList{--rowtint:color-mix(in srgb,var(--orange) 6%,var(--paper))}
#stageList tbody tr{transition:background-color .16s ease-out}
#stageList tbody tr .fbtn2{transition:transform .16s ease-out}
#stageList td.hf{transition:color .16s ease-out}
@media(hover:hover){
  #stageList tbody tr:not(.grp):not(.chn):has(.fbtn2){cursor:pointer}
  #stageList tbody tr:not(.grp):not(.chn):hover{background:var(--rowtint)}
  #stageList tbody tr:not(.grp):not(.chn):hover td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
  #stageList tbody tr:not(.grp):not(.chn):hover .fbtn2{text-decoration:underline;
    text-decoration-color:var(--orange);text-decoration-thickness:2px;text-underline-offset:4px;
    transform:translateX(4px)}
  #stageList tbody tr:not(.grp):not(.chn):hover td.hf{color:var(--ink)}
  #stageList tbody tr:not(.grp):not(.chn):hover .rowadd:not(.on){border-color:var(--ink);color:var(--ink)}
}
/* In the card layout the tint runs 12px into the gutter and the rail sits
   outside the text. Both are shadows, so nothing in the row moves. */
@media(hover:hover) and (max-width:900px){
  #stageList tbody tr:not(.grp):not(.chn):hover{box-shadow:-12px 0 0 0 var(--rowtint),
    -15px 0 0 0 var(--orange),12px 0 0 0 var(--rowtint)}
  #stageList tbody tr:not(.grp):not(.chn):hover td:first-child{box-shadow:none}
}
@media(prefers-reduced-motion:reduce){
  #stageList tbody tr,#stageList tbody tr .fbtn2,#stageList td.hf{transition:none}
  #stageList tbody tr:not(.grp):not(.chn):hover .fbtn2{transform:none}
}
#stageList tbody tr:not(.grp):not(.chn):has(.fbtn2):active{
  --rowtint:color-mix(in srgb,var(--orange) 12%,var(--paper));background:var(--rowtint)}
.landed{animation:landed 1.5s ease-out both}
.landed td:first-child,.landed.chip,.landed.cmp{box-shadow:inset 3px 0 0 var(--orange)}
@keyframes landed{from{background:color-mix(in srgb,var(--orange) 16%,var(--paper))}to{background:transparent}}
.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.bump{display:inline-block;animation:bump .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.55);color:var(--orange)}100%{transform:scale(1)}}
.tick{display:inline-block;animation:tick .38s ease-out}
@keyframes tick{0%{color:var(--orange);transform:translateY(-3px)}100%{transform:none}}
.mark i.beat{animation:beat .36s cubic-bezier(.3,1.5,.5,1)}
@keyframes beat{0%{transform:scale(1)}40%{transform:scale(2.2)}100%{transform:scale(1)}}
/* the scroll line under the nav, with a head and a tick for each section */
.sline{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none;z-index:2}
.sline .fill{position:absolute;left:0;top:0;height:2px;width:100%;background:var(--orange);
  transform-origin:left center;transform:scaleX(0)}
.sline .head{position:absolute;top:-2px;width:6px;height:6px;margin-left:-3px;border-radius:50%;
  background:var(--orange);opacity:0;transition:opacity .2s}
.sline.on .head{opacity:1}
.sline .head.hit{animation:beat .36s cubic-bezier(.3,1.5,.5,1)}
.sline .tk{position:absolute;top:-3px;width:1px;height:5px;background:var(--ink3);opacity:.55}
.sline .tk.past{background:var(--orange);opacity:1}
.sline.sweep .fill{animation:sweep .7s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes sweep{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
html.theming *,html.theming *::before,html.theming *::after{
  transition:background-color .28s ease,color .28s ease,border-color .28s ease,fill .28s ease!important}
.thm svg{transition:transform .38s cubic-bezier(.3,1.4,.5,1)}
.thm.turn svg{transform:rotate(180deg)}
@media(prefers-reduced-motion:reduce){
  .landed{animation:none;background:color-mix(in srgb,var(--orange) 10%,var(--paper))}
  .pop,.bump,.tick,.mark i.beat,.sline .head.hit,.sline.sweep .fill{animation:none}
  .seg button:active,.cbtn:active,.thm:active,.rowadd:active,.addbtn:active,.grpadd:active,
  button.stat:active,.fsel>button:active,.fmenu button:active,.freset:active,.back:active,
  .chip:active,.lnk:active,.mktsw button:active{transform:none}
  html.theming *{transition:none!important}
}
@media print{.sline{display:none}}


/* at phone width the strip scales to a hairline; the Market view carries the full figure */
@media(max-width:760px){.hero-fig{display:none}}
header.top h1{margin:12px 0 0;font-size:clamp(34px,5.4vw,72px);color:var(--ink3);max-width:20ch}
header.top h1 b{color:var(--ink);font-weight:700}
header.top .sub{margin:22px 0 0;max-width:62ch;font-size:15px;color:var(--ink2);line-height:1.62}
header.top .by{margin-top:18px;text-transform:none;letter-spacing:.04em;font-size:11px}
.stats{display:flex;flex-wrap:wrap;gap:0;margin:34px 0 0;border-top:1px solid var(--ink)}
.stat{flex:1 1 150px;padding:14px 16px 16px 0;border-right:1px solid var(--rule);
  display:flex;flex-direction:column;justify-content:flex-start}
.stat + .stat{padding-left:16px}
.stat span{min-height:2.7em}
.stat:last-child{border-right:0}
.stat b{display:block;font:800 38px/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:5px;font:600 9.5px/1.35 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3)}
.stat.hot b{color:var(--ink)}
/* Every one of these numbers is a filter the reader could already set by hand.
   Making them buttons is the whole change; the type does not move. */
button.stat{appearance:none;background:none;border:0;border-right:1px solid var(--rule);
  font:inherit;text-align:left;cursor:pointer;color:inherit;transition:background .12s}
button.stat:last-child{border-right:0}
/* Orange means one thing on this page and it is the track record. A pressed
   filter is shown with ink: the label goes solid and a rule appears under the
   stat. Nothing here borrows the one colour that already has a job. */
button.stat{position:relative;padding-bottom:18px}
button.stat::after{content:"";position:absolute;left:0;right:16px;bottom:0;height:2px;
  background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .14s}
button.stat:hover::after,button.stat:focus-visible::after{transform:scaleX(.18)}
button.stat[aria-pressed="true"]::after{transform:scaleX(1)}
button.stat[aria-pressed="true"] span{color:var(--ink)}
button.stat:hover span,button.stat:focus-visible span{color:var(--ink2)}
@media(hover:none){button.stat:hover::after{transform:scaleX(0)}
  button.stat[aria-pressed="true"]:hover::after{transform:scaleX(1)}}

/* ----------------------------------------------------------------- filters */
.filters{padding:20px 0 18px}
/* Five controls, not seventeen chips. Each opens a small menu; what is actually
   applied is shown underneath as removable chips with a reset that is always
   present once anything is on. */
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fsel{position:relative}
.fsel > button{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule2);border-radius:2px;padding:10px 13px;color:var(--ink);
  background:var(--paper);display:inline-flex;align-items:center;gap:9px}
.fsel > button:hover{border-color:var(--ink)}
.fsel > button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fsel > button .car{font-size:8px;color:var(--ink3)}
.fsel > button .nsel{background:var(--ink);color:var(--on-ink);border-radius:99px;
  min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;padding:0 4px}
.fsel.open > button{border-color:var(--ink);background:var(--paper3)}
.fmenu{position:absolute;top:calc(100% + 5px);left:0;z-index:70;min-width:255px;max-height:340px;
  overflow:auto;background:var(--paper);border:1px solid var(--ink);border-radius:2px;
  box-shadow:0 14px 40px rgba(var(--shade),.14);padding:5px}
.fmenu button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;
  font:500 13px/1.3 var(--sans);color:var(--ink);padding:9px 10px;border-radius:2px}
.fmenu button:hover{background:var(--paper3)}
.fmenu button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.fmenu button i{width:13px;height:13px;border:1px solid var(--rule2);border-radius:2px;
  flex:none;display:block;background:var(--paper)}
.fmenu button[aria-checked="true"] i{background:var(--ink);border-color:var(--ink);
  box-shadow:inset 0 0 0 2px var(--paper)}
.fmenu button s{margin-left:auto;text-decoration:none;font:600 10px/1 var(--mono);color:var(--ink3)}
.fmenu button[disabled]{opacity:.38}
.fapplied{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px;min-height:1px}
.fapplied .ac2{font:600 10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;
  border:1px solid var(--ink);border-radius:99px;padding:6px 7px 6px 11px;color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;background:var(--paper)}
.fapplied .ac2 span{font-size:13px;line-height:1;color:var(--ink3)}
.fapplied .ac2:hover span{color:var(--ink)}
.freset{font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);border-radius:99px;padding:7px 13px}
.freset:hover{background:var(--ink2);border-color:var(--ink2)}
.freset:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fcount{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
@media(max-width:640px){
  .fmenu{min-width:min(78vw,255px)}
  /* three rows of controls pushes the table off the screen on a phone */
  .fbar{gap:6px}
  .fsel > button{padding:9px 9px;letter-spacing:.05em;gap:6px}
  .fcount{flex:1 0 100%;order:9}
  .legend i{font-size:11.5px}
  .legend i.rule{margin-left:0;flex:1 0 100%}
}
.fbtn{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule2);border-radius:2px;padding:9px 12px;color:var(--ink3)}
.fbtn b{margin-left:7px;color:var(--ink)}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.fbtn.on b{color:var(--on-ink)}
.fnote{font-size:12.5px;color:var(--ink3);flex:1 1 260px;min-width:200px}

/* ------------------------------------------------------------------ matrix */
.mwrap{display:grid;grid-template-columns:34px 1fr;gap:0}
.ylab{writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;
  font:600 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  padding:0 10px 0 0}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;
  border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:12px 12px 14px;min-height:104px;background:var(--paper)}
.cell.best{background:var(--paper2)}
.chead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.chead b{font:700 17px/1 var(--sans);letter-spacing:-.02em}
.chead span{font:600 9px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:500 12px/1 var(--sans);letter-spacing:-.01em;padding:7px 9px;border-radius:2px;
  border:1px solid var(--rule2);color:var(--ink2);background:var(--paper);text-align:left}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.i-clear{background:var(--orange);border-color:var(--orange);color:var(--on-orange);font-weight:700}
.chip.i-partial{border-color:var(--ink3);color:var(--ink);background:var(--paper3)}
.chip.printing{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}
.chip.printing.i-clear{color:var(--on-orange)}
.chip.printing.i-clear{background:var(--orange);border-color:var(--orange)}
.chip.printing::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--on-ink);margin-left:7px;vertical-align:middle}
.chip.dim{opacity:.45}
.chead b .of{font:500 11px/1 var(--mono);font-style:normal;color:var(--ink3);letter-spacing:0}
.chip .vol{margin-left:7px;font:500 9.5px/1 var(--mono);font-style:normal;
  color:var(--ink3);font-variant-numeric:tabular-nums}
.chip.i-clear .vol{color:var(--on-orange)}
.chip.printing .vol{color:var(--on-ink-dim)}
.chip.printing.i-clear .vol{color:var(--on-orange)}
.chip.sel{box-shadow:0 0 0 2px var(--ink)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.xrow{display:grid;grid-template-columns:repeat(3,1fr);margin-left:34px}
.xrow div{font:600 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);padding:10px 12px}
.xrow div.hi{color:var(--ink)}
.xtitle{margin:2px 0 0 34px;font:600 10px/1 var(--mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3)}
.mnote{margin:26px 0 0;max-width:78ch;font-size:14.5px;line-height:1.65;color:var(--ink2)}
.mnote b{font-weight:700;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 22px;
  padding:14px 0 0;border-top:1px solid var(--rule)}
.legend i{display:flex;align-items:center;gap:8px;font-style:normal;font-size:12.5px;color:var(--ink3)}
.legend i.rule{display:block;margin-left:auto;color:var(--ink2);font-size:12.5px}
.legend i.rule b{font-weight:700;color:var(--ink)}
.legend .sw{width:14px;height:14px;border-radius:2px;border:1px solid var(--rule2)}
.legend .sw.o{background:var(--orange);border-color:var(--orange)}
.legend .sw.p{border-color:var(--ink3);background:var(--paper3)}
.legend .sw.k{background:var(--ink);border-color:var(--ink);position:relative}
.legend .sw.k::after{content:"";position:absolute;left:4px;top:4px;width:4px;height:4px;border-radius:50%;background:var(--on-ink)}
@media(max-width:720px){
  .matrix{grid-template-columns:1fr}
  .xrow{display:none}.ylab{display:none}.mwrap{grid-template-columns:1fr}
  .xtitle{margin-left:0}
}

/* -------------------------------------------------------------------- list */
.scroll{overflow-x:auto;position:relative;border-top:1px solid var(--ink)}
/* A table wider than the phone says so: a fade on the edge that has more, and one line above it. */
.swipe{position:relative}
.swipe::after{content:'';position:absolute;top:1px;right:0;bottom:0;width:56px;pointer-events:none;
  background:linear-gradient(to right,transparent,var(--paper) 85%);opacity:0;transition:opacity .2s}
.swipe.more::after{opacity:1}
.swipe-hint{display:none;margin:0 0 8px;color:var(--ink3)}
.swipe.more .swipe-hint{display:block}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font:600 9.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:12px 14px 12px 0;border-bottom:1px solid var(--rule)}
td{padding:13px 14px 13px 0;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:top}
td.f{font-weight:600;letter-spacing:-.01em;padding:0}
.fbtn2{display:block;width:100%;text-align:left;font:600 inherit/inherit var(--sans);
  font-size:14px;letter-spacing:-.01em;color:var(--ink);padding:13px 14px 13px 0}
.fbtn2:hover{text-decoration:underline;text-underline-offset:3px}
.fbtn2:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.ac{width:44px;text-align:right}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.rowadd{width:26px;height:26px;border:1px solid var(--rule2);border-radius:2px;
  font:700 13px/1 var(--mono);color:var(--ink3);background:var(--paper)}
.rowadd:hover{border-color:var(--ink);color:var(--ink)}
.rowadd.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.rowadd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grpadd{float:right;font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);border:1px solid var(--rule2);border-radius:2px;padding:5px 8px;
  background:var(--paper)}
.grpadd:hover{border-color:var(--ink);color:var(--ink)}
.grpadd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
tr.grp td{font:600 9.5px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);background:var(--paper3);padding:10px 14px 10px 10px}
tr.grp em{font:400 11px/1.5 var(--sans);letter-spacing:0;text-transform:none;
  color:var(--ink3);font-style:normal;margin-left:10px}
.mzero{margin:22px 0 0;font:600 13px/1.6 var(--sans);color:var(--ink2)}
.yn{font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;
  border-radius:2px;border:1px solid var(--rule2);color:var(--ink3)}
.yn.clear{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.yn.partial{border-color:var(--ink3);color:var(--ink);background:var(--paper3)}
.yn.innovation.clear{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.mini.press li{margin-bottom:10px}
.mini.press a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule2)}
.mini.press a:hover{border-bottom-color:var(--ink)}
.mini.press .out{display:block;font:500 10.5px/1.5 var(--mono);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink4);margin-top:3px}
.yn.chk{border-color:var(--ink3);color:var(--ink);background:var(--paper3);
  border-style:dashed}
.empty{color:var(--ink3);font-size:14px;padding:26px 0}

/* --------------------------------------------------------------- firm page */
#stageFirm{display:none;padding-bottom:80px}
#stageFirm.on{display:block}
.back{display:inline-flex;align-items:center;gap:10px;margin:26px 0 0;
  font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.back:hover{color:var(--ink)}
.arrow{width:22px;height:22px;border:1px solid currentColor;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.arrow svg{width:9px;height:9px}
.fhead{padding:26px 0 30px;border-bottom:1px solid var(--ink)}
.fhead h1,.fhead h2{margin:0;font-size:clamp(32px,5.4vw,66px)}
.fhead .kst{margin:16px 0 0;font:600 11px/1.5 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3)}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 0;align-items:center}
.tag{font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  background:var(--ink3);color:var(--on-ink);border-radius:99px;padding:7px 11px}
.tag.k{background:var(--ink)}
.tag.o{background:var(--orange);color:var(--on-orange)}
.tag.q{background:none;color:var(--ink3);border:1px solid var(--rule2)}
.cnote{margin:18px 0 0;font-size:12.5px;color:var(--ink3)}
.lnk{display:inline-flex;align-items:center;gap:7px;font:600 9.5px/1 var(--mono);
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink);border:1px solid var(--rule2);
  border-radius:99px;padding:6px 11px 6px 8px}
.lnk:hover{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.lnk svg{width:13px;height:13px;flex:none}
/* The label a page gives a number: warranty, fax, Houston office. Lower case,
   because it is the page's wording and not a heading. */
.lnkq{font:500 9.5px/1 var(--mono);letter-spacing:.04em;text-transform:none;color:var(--ink3);
  padding-left:7px;margin-left:2px;border-left:1px solid var(--rule2)}
.lnk:hover .lnkq{color:var(--on-ink);border-left-color:var(--on-ink-rule)}
/* The number directory. One number per line, monospace so the digits align,
   and plain text on the label so a fax reads as a fax. */
.dial{list-style:none;margin:10px 0 0;padding:0}
.dial li{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule)}
.dial li:last-child{border-bottom:none}
.dial a{font:500 13px/1.4 var(--mono);color:var(--ink)}
.dial a:hover{text-decoration:underline}
.dial .q{font-size:12.5px;color:var(--ink3)}
.dialhead{margin-bottom:2px}
.dialmain{display:inline-block;font:500 22px/1.25 var(--mono);color:var(--ink);letter-spacing:-.01em}
.dialmain:hover{text-decoration:underline}
.mailline{margin:14px 0 0}
.mailline>a{display:inline-block;font:500 17px/1.3 var(--mono);color:var(--ink);overflow-wrap:anywhere}
.mailline>a:hover{text-decoration:underline}
.dialhead+.mailline{margin-top:18px}
/* an address is case-sensitive to the eye even where it is not to the server */
.lnk.mail{text-transform:none;letter-spacing:.01em}
.dialmeta{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-top:5px}
.dialmeta .q{font-size:13px;color:var(--ink3)}
.row{display:grid;grid-template-columns:186px 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--rule)}
.row>.body{min-width:0}
@media(max-width:720px){.row{grid-template-columns:1fr;gap:12px;padding:22px 0}}
.verdict{margin:0;font-size:19px;line-height:1.45;letter-spacing:-.012em;max-width:70ch}
.syn{margin:0;font-size:14.5px;line-height:1.65;color:var(--ink2);max-width:74ch}

/* three counts */
.why{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.why li{display:grid;grid-template-columns:78px 1fr;gap:16px;align-items:start;
  padding:14px 0;border-top:1px solid var(--rule)}
.why li:first-child{border-top:0}
.vv{font:700 13px/1 var(--sans);letter-spacing:-.01em}
.vv.clear{color:var(--ink)}
.vv.partial{color:var(--ink2)}
.vv.fail{color:var(--ink3)}
/* orange means one thing on this page: the firm has paid for an unproven method */
.why li.inn .vv.clear{background:var(--orange);color:var(--on-orange);
  border-radius:2px;padding:3px 7px;margin-left:0;display:inline-block;justify-self:start}
.why b{display:block;font:600 13.5px/1.35 var(--sans);margin-bottom:4px}
.why .tx{display:block;font-size:13.5px;line-height:1.6;color:var(--ink2)}

/* people */
.p1{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:start;
  padding:14px 0;border-top:1px solid var(--rule)}
.p1:first-child{border-top:0}
.p1.dec{background:var(--paper2);border-radius:3px;padding:14px 12px;margin:0}
.p1 .nm{font:600 15px/1.3 var(--sans);letter-spacing:-.01em}
.p1 .rl{font-size:13px;color:var(--ink3);margin-top:2px}
.p1 .rl.warn{color:var(--ink);font-weight:600;margin-top:6px;max-width:60ch}
.p1 .ev{grid-column:1/-1;font-size:12.5px;line-height:1.55;color:var(--ink3);
  border-left:2px solid var(--rule2);padding-left:11px;margin-top:8px}
.p1 .ev em{font-style:normal;color:var(--ink2);font-weight:600}
.p1.gone .nm{color:var(--ink3)}
.badge{display:inline-block;margin-left:9px;font:700 8.5px/1 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;background:var(--ink);color:var(--on-ink);border-radius:99px;padding:5px 8px;
  vertical-align:middle}
.badge.g{background:var(--ink4)}
.icons{display:flex;gap:6px;align-items:center}
.org{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px;margin:4px 0 6px}
.org ul{display:flex;justify-content:center;margin:0;padding:18px 0 0;list-style:none;position:relative}
.org>ul{padding-top:0;min-width:max-content}
.org li{position:relative;padding:18px 5px 0;display:flex;flex-direction:column;align-items:center}
.org li::before,.org li::after{content:'';position:absolute;top:0;right:50%;width:50%;height:18px;border-top:1px solid var(--rule2)}
.org li::after{right:auto;left:50%;border-left:1px solid var(--rule2)}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:only-child{padding-top:0}
.org li:first-child::before,.org li:last-child::after{border:0 none}
.org li:last-child::before{border-right:1px solid var(--rule2);border-radius:0 3px 0 0}
.org li:first-child::after{border-radius:3px 0 0 0}
.org ul ul::before{content:'';position:absolute;top:0;left:50%;width:0;height:18px;border-left:1px solid var(--rule2)}
.onode{display:inline-flex;flex-direction:column;align-items:center;gap:3px;font:600 13px/1.2 var(--sans);
  color:var(--ink);background:var(--paper);border:1px solid var(--rule2);border-radius:2px;padding:7px 10px;
  max-width:190px;text-align:center;text-wrap:balance;word-spacing:.08em}
button.onode{cursor:pointer}
button.onode:hover{border-color:var(--ink)}
.onode.off{color:var(--ink2);border-style:dashed}
.onode.cur{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.ocap{font:500 10px/1.3 var(--mono);color:var(--ink3);letter-spacing:.02em}
.oleaves{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:600px;margin-top:18px;
  padding-top:10px;border-top:1px solid var(--rule2);position:relative}
.oleaves::before{content:'';position:absolute;top:-19px;left:50%;height:18px;border-left:1px solid var(--rule2)}
.oleaves .onode{font-size:12px;padding:6px 8px}
.olab{font:700 10px/1.35 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:18px 0 8px}
.olab:first-child{margin-top:2px}
.obin{display:flex;flex-wrap:wrap;gap:6px}
.oties{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.oties li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.okind{font:600 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);
  border:1px solid var(--rule2);border-radius:2px;padding:3px 5px 2px}
.orel{font-size:14px;color:var(--ink2)}
@media(max-width:640px){
  .org{overflow-x:visible}
  .org ul{display:block;padding:0 0 0 16px}
  .org>ul{padding-left:0;min-width:0}
  .org li{display:block;padding:6px 0 0 16px}
  .org>ul>li{padding-left:0}
  .org li::before,.org li:first-child::before,.org li:last-child::before,.org li:only-child::before{display:block;
    top:0;left:0;right:auto;bottom:0;width:0;height:auto;border:0;border-left:1px solid var(--rule2);border-radius:0}

/* cover flow. The geometry, the easing and the drag discrimination are ported
   from the Americas rolodex: 96px spacing, a 180px edge shift, 110px of depth
   per step, 58 degrees of rotation at the edge, 0.82 scale at one step out and
   a 0.16 ease factor, which is what makes it feel like an iPod rather than a
   carousel. Only the card face is ours. */
.cfshell{position:relative;padding:6px 0 40px}
.cf-stage{position:relative;height:460px;perspective:2400px;perspective-origin:50% 46%;
  overflow:hidden;touch-action:pan-y;cursor:grab;z-index:1;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%)}
.cf-stage.dragging{cursor:grabbing}
.cf-scene{position:absolute;top:0;left:50%;width:0;height:100%;transform-style:preserve-3d}
.cf-card{position:absolute;top:50%;left:0;width:min(300px,calc(100vw - 48px));height:300px;margin-top:-150px;
  margin-left:-150px;transform-style:preserve-3d;will-change:transform,opacity;cursor:pointer}
.cf-card:focus{outline:none}
.cf-card:focus-visible .tile{outline:2px solid var(--ink);outline-offset:3px}
.cf-card .tile{position:relative;width:100%;height:100%;background:var(--paper);
  border:1px solid var(--rule2);padding:17px 19px;display:flex;flex-direction:column;gap:7px;
  box-shadow:0 18px 40px rgba(var(--shade),.09);overflow:hidden}
.cf-card .tile::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(var(--grain),.05) 1px,transparent 1px);background-size:4px 4px}
.cf-card .tile .pip{position:absolute;top:0;left:0;width:46px;height:4px;background:var(--ink);z-index:3}
.cf-card.i-clear .tile .pip{background:var(--orange)}
.cf-card.adopter .tile .pip{width:100%;background:var(--ink)}
.cf-card .t-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font:600 9px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  position:relative;z-index:2}
.cf-card .t-row .tier{border:1.5px solid currentColor;border-radius:2px;padding:3px 7px;
  font-weight:700;letter-spacing:.12em}
.cf-card .cname{font-weight:700;letter-spacing:-.025em;line-height:1.05;color:var(--ink);
  position:relative;z-index:2}
.cf-card .csyn{font-size:12px;line-height:1.5;color:var(--ink2);position:relative;z-index:2;
  overflow:hidden;flex:1}
.cf-card .crow{display:flex;gap:4px;position:relative;z-index:2;flex-wrap:wrap}
.cf-card .crow span{font:700 9.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--rule2);border-radius:2px;padding:5px 5px;color:var(--ink3);white-space:nowrap}
.cf-card .crow span.clear{color:var(--ink);border-color:var(--ink3)}
.cf-card .crow span.m2.clear{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.cf-card .url-row{font:500 10px/1.3 var(--mono);color:var(--ink3);position:relative;z-index:2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf-card .url-row.muted{color:var(--ink4)}
.cf-card .reflection{position:absolute;top:100%;left:0;width:100%;height:100%;
  height:56%;transform:scaleY(-1);transform-origin:center;opacity:.13;pointer-events:none;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(to top,#000,transparent 82%);
  mask-image:linear-gradient(to top,#000,transparent 82%)}
.cf-card .reflection .tile{box-shadow:none}
/* the mirrored copy doubles the paint cost of every visible card */
.cf-stage.dragging .reflection{display:none}
/* on a phone the card is short enough that the mirrored badges read as a fault */
@media(max-width:640px){.cf-card .reflection{display:none}}

/* The links of the wall chain, inside the contractor section. The class is chn,
   not lnk: .lnk is already this deck's inline link button, and reusing the name
   put a 9.5px mono uppercase button style on a whole table row and collapsed it
   to the width of the first column.
   Subordinate to a
   section header and clearly above a firm row: a rule above, the label in ink,
   the count, and the sentence that says why the link matters. */
#stageList tr.chn td{border-top:1px solid var(--rule2);border-bottom:0;
  padding:22px 0 8px;background:transparent}

  text-transform:uppercase;color:var(--ink)}

  font:600 10px/1.5 var(--mono);color:var(--ink3);vertical-align:1px}
#stageList tr.chn em{display:block;margin-top:5px;max-width:64ch;font-style:normal;
  font-size:12.5px;line-height:1.55;color:var(--ink3)}

/* A title that is also a link. The underline sits off the baseline so a 30 to
   44px display face does not look struck through, and the glyph after it is the
   thing that says it leaves the page: an underline alone on a heading reads as
   emphasis. */
.hlink{color:inherit;text-decoration:underline;text-decoration-thickness:1.5px;
  text-underline-offset:5px;text-decoration-color:var(--rule2)}
.hlink:hover,.hlink:focus-visible{text-decoration-color:var(--ink)}
.hlink .hout{display:inline-block;width:.42em;height:.42em;margin-left:.34em;
  vertical-align:.16em;color:var(--ink3)}
/* The display face on a firm page runs to 56px, where .42em is a 23px icon that
   reads as a button rather than a mark. It scales down, not up. */
.fhead h1 .hout,.fhead h2 .hout{width:.26em;height:.26em;margin-left:.26em;vertical-align:.3em}
.fhead h1 .hlink,.fhead h2 .hlink{text-decoration-thickness:2px;text-underline-offset:.1em}
.hlink .hout svg{width:100%;height:100%;display:block}
.hlink:hover .hout,.hlink:focus-visible .hout{color:var(--ink)}

.lim{display:grid;grid-template-columns:186px 1fr;gap:28px;padding:16px 0;border-bottom:1px solid var(--rule)}

/* On a phone the list stops being a table. Seven columns inside 358px meant a
   sideways swipe past a sticky firm name that covered the counts you were
   swiping to reach, so the counts were unreachable. Each firm is now one
   stacked block: name, then the three counts and the decision-maker as labelled
   chips, with the call-list button in the corner. No sideways scroll at all. */
@media(max-width:900px){
  #stageList .scroll{overflow-x:visible;border-top:0}
  #stageList table{min-width:0;display:block}
  #stageList thead{display:none}

<script>
/* ------------------------------------------------------------------ ground
   Ported verbatim from the Americas rolodex (ibarzabalhec/icon-americas-rolodex,
   index.html). A procedural heightfield of six to eight anisotropic gaussians,
   traced with marching squares into topographic iso-lines, with peak drift,
   per-peak amplitude LFOs, elevation labels and an occasional gleam sweep.
   Throttled, gated on prefers-reduced-motion, and paused when the tab hides.
   Only the colour tokens it reads were changed. */
function initAtmosphere() {
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('atmos');
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');

  const state = {
    w: 0, h: 0, dpr: 1,
    mouseX: 0, mouseY: 0,
    scrollY: 0, targetScrollY: 0,
    parallaxX: 0, parallaxY: 0, targetParallaxX: 0, targetParallaxY: 0,
    // Animation state — added for the drift/gleam/label-breath layers.
    peaks: null,              // mutable peak objects (built once per resize)
    labelSlots: null,         // mutable label positions with phase offsets
    gleam: null,              // active gleam sweep (or null when idle)
    nextGleamAt: 0,           // ms timestamp when the next gleam should trigger
    lastFrame: 0,             // last RAF timestamp (for dt calc)
    lastRender: 0,            // last canvas redraw timestamp (for 15 fps throttle)
    rafId: 0,                 // live RAF handle (0 = not looping)
    animate: false,           // master flag — set by decideMode() based on gates
  };

  // Colors read once per resize / theme change (not every frame).
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const ink = (cs.getPropertyValue('--ink').trim()) || '#111111';
    // index contours are the same ink, carried by weight and alpha rather than
    // by hue: the accent belongs to the third count and nothing else.
    const accent = ink;
    const isLight = document.documentElement.getAttribute('data-theme') !== 'dark';
    return { accent, ink, isLight };
  }

  // Stable PRNG — shapes persist across draws
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function() {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Procedural heightfield built from a few 2-D gaussians → gives real
  // topographic elevation contours when you sample at evenly-spaced levels
  // (like a USGS quad map). Each peak carries drift velocity + amplitude
  // LFO state so the field can mutate frame-to-frame.
  function buildPeaks(w, h) {
    const r = mulberry32(20260419);
    const n = 6 + Math.floor(r() * 3);        // 6-8 peaks/basins
    const peaks = [];
    for (let i = 0; i < n; i++) {
      const ampBase = (r() > 0.35 ? 1 : -0.6) * (0.55 + r() * 0.85);
      peaks.push({
        cx: (0.05 + r() * 0.9) * w,
        cy: (0.05 + r() * 0.9) * h,
        // Current (animated) amp — initialized to the LFO value at t=0, which
        // equals ampBase since sin(phase) is normalized below.
        amp: ampBase,
        ampBase,
        // Anisotropic — stretches to feel like ridgelines, not circles
        sx: (0.12 + r() * 0.22) * Math.min(w, h),
        sy: (0.10 + r() * 0.20) * Math.min(w, h),
        theta: r() * Math.PI,
        // Drift — gentle random-walk velocity in px/sec. Kept small so peaks
        // wander organically over tens of seconds rather than streaking.
        vx: (r() - 0.5) * 8,
        vy: (r() - 0.5) * 6,
        // Amplitude LFO — each peak breathes on its own period + phase so the
        // field ripples asynchronously, never pulsing in lockstep.
        ampLfoPeriodS: 25 + r() * 50,         // 25–75 seconds per cycle
        ampLfoPhase: r() * Math.PI * 2,
        ampLfoDepth: 0.12 + r() * 0.10,       // ±12–22% of ampBase
      });
    }
    return peaks;
  }
  function heightAt(x, y, peaks) {
    let z = 0;
    for (const p of peaks) {
      const dx = x - p.cx, dy = y - p.cy;
      const cs = Math.cos(p.theta), sn = Math.sin(p.theta);
      const u = (dx * cs + dy * sn) / p.sx;
      const v = (-dx * sn + dy * cs) / p.sy;
      z += p.amp * Math.exp(-(u*u + v*v) * 0.5);
    }
    // Low-amplitude, high-freq ripple for organic crispness (no wobble)
    z += 0.04 * Math.sin(x * 0.013 + y * 0.009);
    z += 0.03 * Math.cos(x * 0.007 - y * 0.017);
    return z;
  }

  // Marching-squares iso-line tracer over a coarse grid. Produces proper
  // topographic contours rather than concentric ellipses — i.e. real map
  // elevation lines that branch, close, and meander naturally.
  function drawContours(ctx, w, h, peaks, levels, colors) {
    const step = 14;                 // grid step in px — smaller = smoother
    const cols = Math.ceil(w / step) + 1;
    const rows = Math.ceil(h / step) + 1;
    const grid = new Float32Array(cols * rows);
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        grid[j * cols + i] = heightAt(i * step, j * step, peaks);
      }
    }
    function get(i, j) { return grid[j * cols + i]; }
    function lerp(a, b, t) { return a + (b - a) * t; }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    levels.forEach((level, idx) => {
      const isIndex = (idx % 5 === 0);   // every 5th contour is an "index contour"
      ctx.strokeStyle = isIndex ? colors.accent : colors.ink;
      ctx.globalAlpha = isIndex ? colors.alphaIndex : colors.alphaMinor;
      ctx.lineWidth = isIndex ? 1.2 : 0.7;
      ctx.beginPath();
      for (let j = 0; j < rows - 1; j++) {
        for (let i = 0; i < cols - 1; i++) {
          const a = get(i, j);
          const b = get(i+1, j);
          const c = get(i+1, j+1);
          const d = get(i, j+1);
          let code = 0;
          if (a > level) code |= 1;
          if (b > level) code |= 2;
          if (c > level) code |= 4;
          if (d > level) code |= 8;
          if (code === 0 || code === 15) continue;
          const x0 = i * step, y0 = j * step;
          const x1 = x0 + step, y1 = y0 + step;
          // Interpolate crossing points on each edge
          const tA = (level - a) / (b - a || 1e-9);
          const tB = (level - b) / (c - b || 1e-9);
          const tC = (level - d) / (c - d || 1e-9);
          const tD = (level - a) / (d - a || 1e-9);
          const pA = [x0 + step * tA, y0];
          const pB = [x1,             y0 + step * tB];
          const pC = [x0 + step * tC, y1];
          const pD = [x0,             y0 + step * tD];
          function seg(p, q) {
            ctx.moveTo(p[0], p[1]);
            ctx.lineTo(q[0], q[1]);
          }
          switch (code) {
            case 1:  case 14: seg(pA, pD); break;
            case 2:  case 13: seg(pA, pB); break;
            case 4:  case 11: seg(pB, pC); break;
            case 8:  case 7:  seg(pC, pD); break;
            case 3:  case 12: seg(pB, pD); break;
            case 6:  case 9:  seg(pA, pC); break;
            case 5:  seg(pA, pD); seg(pB, pC); break;
            case 10: seg(pA, pB); seg(pC, pD); break;
          }
        }
      }
      ctx.stroke();
    });
  }

  // Survey-paper grid — clean straight lines with tick marks. Subtle; intended

  function drawGrid(ctx, w, h, colors) {
    ctx.save();

    ctx.globalAlpha = colors.alphaGrid;
    ctx.lineWidth = 0.4;
    const major = 120;     // primary grid spacing
    ctx.beginPath();
    for (let x = major; x < w; x += major) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    for (let y = major; y < h; y += major) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
    // Minor grid — dotted ticks every 30px along the major lines
    ctx.globalAlpha = colors.alphaGrid * 0.45;
    ctx.beginPath();
    for (let x = 0; x < w; x += 30) { ctx.moveTo(x, 0); ctx.lineTo(x, 4); }

  // elevation number re-samples from heightAt() every frame and the opacity
  // breathes on an independent period per slot.
  function buildLabelSlots(w, h) {
    const r = mulberry32(42);
    const slots = [];

      slots.push({
        x: (0.40 + r() * 0.55) * w,
        y: (0.55 + r() * 0.35) * h,
        // Breath period in seconds + phase offset so labels pulse out of sync.

      // a label always stays legible but the field looks like it's breathing.

      p.vy += (Math.random() - 0.5) * 2.5 * dt;

      p.vy *= 0.985;
      p.cx += p.vx * dt;
      p.cy += p.vy * dt;

      if (p.cy > state.h - insetY) { p.cy = state.h - insetY; p.vy = -Math.abs(p.vy); }

      p.amp = p.ampBase * (1 + p.ampLfoDepth * Math.sin(phase));

        [ 0.10, -0.15,  0.85,  1.15], [ 0.20, 1.15,  0.90, -0.15],
      ];

        progress: 0,
        durationS: 3.5 + Math.random() * 1.5,     // 3.5–5.0 s
        x0: c[0] * state.w, y0: c[1] * state.h,
        x1: c[2] * state.w, y1: c[3] * state.h,
      };
    }

      state.gleam.progress += dt / state.gleam.durationS;
      if (state.gleam.progress >= 1) {

        state.nextGleamAt = tSec * 1000 + (45000 + Math.random() * 45000);  // 45–90 s

    // frame budget headroom.

    if (state.rafId) return;
    state.lastFrame = 0;

  }

    // against a near-white page. The contour ink in light mode is the
    // --text-primary charcoal, so higher alpha reads as legitimate map
    // darkness rather than a faded ghost.
    const colors = {
      accent, ink, isLight,
      // On white, ink at .27 lands on the same grey as the page's own hairlines,
      // which is the weight this should read at: survey linework behind the type,
      // never competing with it.
      alphaGrid:    isLight ? 0.07 : 0.10,
      alphaMinor:   isLight ? 0.13 : 0.12,
      alphaIndex:   isLight ? 0.27 : 0.26,
      alphaLabel:   isLight ? 0.34 : 0.40,
    };
    ctx.clearRect(0, 0, state.w, state.h);
    // Elevation levels — 18 lines spread across the field's dynamic range
    const levels = [];
    const N = 18;
    for (let i = 0; i < N; i++) levels.push(-1.4 + (i / (N - 1)) * 2.8);
    drawGrid(ctx, state.w, state.h, colors);
    drawContours(ctx, state.w, state.h, state.peaks, levels, colors);
    drawElevationLabels(ctx, state.w, state.h, state.peaks, state.labelSlots, colors, tSec || 0);
    // Gleam sits on top so it tints contours + labels briefly.
    drawGleam(ctx, state.w, state.h, state.gleam, colors);
  }

  // Subtle CSS-transform parallax (no canvas redraw)
  let rafPending = false;
  function scheduleParallax() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      state.parallaxX += (state.targetParallaxX - state.parallaxX) * 0.10;
      state.parallaxY += (state.targetParallaxY - state.parallaxY) * 0.10;
      canvas.style.transform = `translate3d(${state.parallaxX.toFixed(2)}px, ${state.parallaxY.toFixed(2)}px, 0)`;
    });
  }

  window.addEventListener('resize', resize, { passive: true });
  if (!reduce) {
    window.addEventListener('mousemove', e => {
      state.targetParallaxX = (e.clientX / state.w - 0.5) * -8;
      state.targetParallaxY = (e.clientY / state.h - 0.5) * -6;
      scheduleParallax();
    }, { passive: true });
    window.addEventListener('scroll', () => {
      const sy = window.scrollY || window.pageYOffset || 0;
      state.targetParallaxY = (sy % 600) * -0.04;
      scheduleParallax();
    }, { passive: true });
  }
  // Re-render when theme flips — if the animation loop is running it'll pick
  // up the new colors on its next tick, but a one-shot redraw makes the flip
  // feel instant instead of waiting for the 65ms throttle.
  const themeObs = new MutationObserver(() => draw(performance.now() / 1000));
  themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // When the tab returns from hidden, reset the dt baseline so drift doesn't
  // snap-advance by the clamped 100ms and push out the next gleam so it doesn't
  // fire immediately on return.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.animate) {
      state.lastFrame = 0;
      state.nextGleamAt = performance.now() + 8000 + Math.random() * 6000;
    }
  });

  resize();
}

/* Ten digits in, one printed form out. Stored bare so nothing downstream has to
   parse a format back apart. */
function dial(d){ return '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6); }
/* A tel: link is not an external page. target=_blank on one opens a dead tab on
   a desktop and does nothing useful on a phone. */
function telPill(d,label){
  if(!d) return '';
  return '<a class="lnk" href="tel:+1'+esc(d)+'">'+SVG.phone+esc(dial(d))+
    (label?'<span class="lnkq">'+esc(label)+'</span>':'')+'</a>';
}
/* A firm inbox, never a person's address. Same reasoning as tel: above: a
   mailto: opens the reader's own mail client and is not an external page. */
function mailPill(a){
  if(!a) return '';
  return '<a class="lnk mail" href="mailto:'+esc(a)+'">'+SVG.mail+esc(a)+'</a>';
}
function icon(url,kind,title){
  if(!url) return '';
  return '<a class="ic '+(kind==='li'?'li':'')+'" href="'+esc(url)+'" target="_blank" rel="noopener" '+
    'title="'+esc(title)+'" aria-label="'+esc(title)+'">'+SVG[kind]+'</a>';
}
function pill(url,kind,label){
  if(!url) return '';
  return '<a class="lnk" href="'+esc(url)+'" target="_blank" rel="noopener">'+SVG[kind]+esc(label)+'</a>';
}
function clip(s,n){if(s.length<=n) return s;var c=s.slice(0,n);c=c.slice(0,c.lastIndexOf(' '));

function src(url,label){

/* Each stat is the filter it describes. Clicking one applies that filter and
   opens the List, because the List drops what does not match and the Screen only
   dims it: 22 contractors shown as 22 rows is the answer, 22 contractors shown
   as 74 grey chips is a description of the answer. Clicking the same stat again
   clears it. The first, which is the whole roster, resets everything. */
function drawStats(){
  /* This runs once before the filter state exists, to paint the strip with the
     rest of the page, and again from render() on every state change. */
  var ready=(typeof F!=='undefined'&&F&&F.group);
  document.getElementById('stats').innerHTML=D.stat_strip.map(function(s,i){
    var f=s[3],on=!ready?!f:(f?statOn(f):(!F.group.length&&!F.count.length&&!F.dec&&!q));
    return '<button class="stat'+(s[2]?' hot':'')+'" data-stat="'+i+'" type="button"'+
      ' aria-pressed="'+(on?'true':'false')+'"><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></button>';
  }).join('');
}
function statOn(f){
  var bare=!q&&!F.count.length&&!F.ph;
  if(f.dec) return bare&&!F.group.length&&F.dec===f.dec;
  if(f.group) return bare&&!F.dec&&F.group.length===1&&F.group[0]===f.group[0];
  return false;
}
drawStats();

  if(f&&!was){ if(f.dec) F.dec=f.dec; if(f.group) F.group=f.group.slice(); mode='list'; }

  render(); toTool();
});

function norm(s){
  s=String(s||'').toLowerCase();
  try{s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){}
  return s.replace(/[.\u2019'\u2018,&-]/g,'').replace(/\s+/g,' ');
}

].join(' '));});

/* ----------------------------------------------------------------- matrix */
/* Reading order is priority order. Both axes run Yes, Partly, No outward from the
   top left, so the cell a reader lands on first is the one that holds all the
   firms that clear both counts. Inside a cell, the largest published builder is
   first: a grid that answers "who" should not hide "how big". */
function volSort(a,b){
  var av=a.vol||-1, bv=b.vol||-1;
  if(av!==bv) return bv-av;
  return a.short.localeCompare(b.short);
}
function drawMatrix(){
  var html='';
  for(var yi=ORD.length-1;yi>=0;yi--){
    for(var xi=ORD.length-1;xi>=0;xi--){
      var y=ORD[yi],x=ORD[xi],key=x+'|'+y;
      var rows=T.filter(function(t){return t.cell===key;}).sort(volSort);
      var best=(x==='clear'&&y==='clear');
      /* Build 66. With filters on, the counter said 7 of 127 and the cells still
         summed to 127. A cell now says how many of its firms are showing. */
      var on=rows.filter(hit).length, fil=(on!==rows.length)||q||activeFilters().length;
      html+='<div class="cell'+(best?' best':'')+'" role="group" aria-label="'+
        'Repetition '+W[x]+', Printer fit '+W[y]+', '+rows.length+' firms">'+
        '<div class="chead"><b>'+(fil?on+'<i class="of"> of '+rows.length+'</i>':rows.length)+'</b><span>Repetition '+W[x]+' &middot; Printer fit '+W[y]+'</span></div>'+
        '<div class="chips">'+rows.map(function(t){
          var al=t.entity_name+'. Repetition '+W[t.marks.repeatability]+
            ', Printer fit '+W[t.marks.machine_fit]+
            ', track record '+W[t.marks.innovation]+
            (t.group==='adopter'?', already buying printed walls':'')+
            (t.has_decider?', decision-maker named':'')+'.';
          return '<button class="chip i-'+t.marks.innovation+(t.group==='adopter'?' printing':'')+
            (hit(t)?'':' dim')+(call.indexOf(t.target_id)>=0?' sel':'')+
            '" data-id="'+t.target_id+'" title="'+esc(t.entity_name)+
            '" aria-label="'+esc(al)+'">'+esc(t.short)+
            (t.vol?'<i class="vol">'+String(t.vol).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'</i>':'')+
            '</button>';
        }).join('')+'</div></div>';
    }
  }
  document.getElementById('matrix').innerHTML=html;
  document.getElementById('xrow').innerHTML=ORD.slice().reverse().map(function(x){
    return '<div class="'+(x==='clear'?'hi':'')+'">Repetition '+W[x]+'</div>';}).join('');
  // Every chip dimmed and nothing said so. The grid looked broken rather than empty.
  var live=T.filter(hit).length;
  var mz=document.getElementById('mzero');
  mz.hidden=(live>0);
  mz.textContent=live?'':('No match'+(q?' for \u201c'+q+'\u201d':'')+
    (activeFilters().length?' with the filters applied':'')+'. '+T.length+' firms are screened.');
}

/* Twenty-one firms that will never buy a machine and should be called before
   most of the roster. They are not on the grid, because scoring a post-tension
   plant against printer fit is a category error dressed as rigour, and they are
   not hidden either: one of them is the only way to learn what any Houston crew
   actually pours in a year. Shown under the list, below the contractors, and
   only when the contractor section is on screen. */
function drawSupply(){
  var el=document.getElementById('supplyBody'); if(!el) return;
  var sup=D.supply||[];
  /* Build 66. These are not roster firms, so the count and contact filters
     have nothing to say about them and hide them. A search runs over them too:
     "No match" above a list of 43 names was the page contradicting itself. */
  var showing=(!F.group.length||F.group.indexOf('trade')>=0)&&!F.count.length&&!F.dec&&!F.ph;
  if(!sup.length||!showing){ el.innerHTML=''; return; }
  var nq=q?norm(q):'';
  var sHit=function(s){return !nq||norm([s.name,s.region,s.line,s.why,
      (s.people||[]).map(function(p){return p.name+' '+p.role;}).join(' ')].join(' ')).indexOf(nq)>=0;};
  var nHit=function(n){return !nq||norm([n.name,n.region,n.note].join(' ')).indexOf(nq)>=0;};
  sup=sup.filter(sHit);
  var SL=D.supply_labels||{}, SN=D.supply_notes||{}, h='';
  ['node','crew'].forEach(function(kind){
    var rows=sup.filter(function(s){return s.kind===kind;});
    if(!rows.length) return;
    h+='<section class="sup"><div class="lab">'+esc(SL[kind]||kind)+
       ' &middot; '+rows.length+'</div>'+
       '<p class="supnote">'+esc(SN[kind]||'')+'</p><ul class="suplist">'+
      rows.map(function(s){
        return '<li><div class="sh">'+
          (s.url?'<a class="hlink" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+
                 esc(s.name)+'<span class="hout">'+SVG.out+'</span></a>':esc(s.name))+
          '<span class="swhere">'+esc(s.region)+'</span></div>'+
          '<p class="sl">'+esc(s.line)+'</p>'+
          '<p class="sw">'+esc(s.why)+'</p>'+
          (s.people&&s.people.length?'<p class="sp">'+s.people.map(function(p){
             return esc(p.name)+'<i>'+esc(p.role)+'</i>';}).join('')+'</p>':'')+
          (s.note?'<p class="note">'+esc(s.note)+'</p>':'')+
          '</li>';}).join('')+'</ul></section>';
  });
  var ns=(D.no_site||[]).filter(nHit);
  if(ns.length){
    h+='<section class="sup"><div class="lab">Publishes no website &middot; '+ns.length+'</div>'+
       '<p class="supnote">'+esc(D.no_site_note||'')+'</p><ul class="nosite">'+
       ns.map(function(n){return '<li><b>'+esc(n.name)+'</b><span class="swhere">'+
         esc(n.region)+'</span><em>'+esc(n.note)+'</em></li>';}).join('')+'</ul></section>';
  }
  el.innerHTML=h;
}

function drawList(){
  var groups=['adopter','a','b','trade','creative','national','channel','icon'].map(function(k){
    return [k,GL[k]||'',GN[k]||''];}),h='';
  var shown=0;
  groups.forEach(function(g){
    var rows=T.filter(function(t){return t.group===g[0]&&hit(t);});
    if(!rows.length) return;
    if(g[0]==='trade'&&D.chain){
      var ord={}; D.chain.forEach(function(c,i){ord[c.key]=i;});
      rows=rows.slice().sort(function(a,b){
        var d=(ord[a.chain]===undefined?99:ord[a.chain])-(ord[b.chain]===undefined?99:ord[b.chain]);
        return d||volSort(a,b);});
    }
    shown+=rows.length;
    var ids=rows.map(function(t){return t.target_id;}).join(',');
    var allIn=rows.every(function(t){return call.indexOf(t.target_id)>=0;});
    h+='<tr class="grp"><td colspan="7"><span class="gl">'+esc(g[1])+'</span><span class="gn">'+rows.length+'</span>'+
       (g[2]?'<em>'+esc(g[2])+'</em>':'')+
       '<button class="grpadd" data-addmany="'+ids+'" aria-pressed="'+allIn+'" aria-label="'+
         (allIn?'Remove all ':'Add all ')+esc(g[1])+(allIn?' from':' to')+' the call list">'+
         (allIn?'Remove all':'Add all')+'</button>'+
       '</td></tr>';
    /* The contractor section reads in the order a wall gets made. A flat list
       of 51 firms hides the thing worth seeing, which is that the first
       contractor pass found 22 firms all sitting in one link of the chain. */
    var chain=(g[0]==='trade')?(D.chain||[]):[];
    var seen={};
    rows.forEach(function(t){
      if(chain.length&&t.chain&&!seen[t.chain]){
        seen[t.chain]=1;
        var c=chain.filter(function(x){return x.key===t.chain;})[0];
        var inLink=rows.filter(function(r){return r.chain===t.chain;}).length;
        if(c) h+='<tr class="chn"><td colspan="7"><b>'+esc(c.label)+'</b>'+
          '<span class="n">'+inLink+'</span><em>'+esc(c.note)+'</em></td></tr>';
      }
      var inCall=call.indexOf(t.target_id)>=0;
      h+='<tr><td class="f"><button class="fbtn2" data-id="'+t.target_id+'">'+
          esc(t.entity_name)+'</button></td>'+
        ['repeatability','machine_fit','innovation'].map(function(k,i){
          return '<td data-l="'+esc(AT[k]||'')+'"><span class="yn '+k+' '+t.marks[k]+'">'+
                 W[t.marks[k]]+'</span></td>';}).join('')+
        '<td data-l="Decision-maker">'+(t.decider_confirmed?'<span class="yn clear">Named</span>':
                 (t.decider_caveat?'<span class="yn chk" title="A decision-maker is named, but has left, is listed at a related entity, or is a probable match. The note is on the contact.">Confirm</span>':''))+'</td>'+

          /* Build 80. A row with dated news since March carries its latest date. */
          ((t.news||[]).length?'<span class="nwt">News '+esc(nwDate(t.news[0].date))+'</span>':'')+'</td>'+
        '<td class="ac"><button class="rowadd'+(inCall?' on':'')+'" data-add="'+t.target_id+

  /* Who, then what to dial. The two were one section in Build 56 and the

  h.push('<button class="addbtn'+(inList?' on':'')+'" data-add="'+t.target_id+'" aria-pressed="'+inList+'">'+

/* ------------------------------------------------------------------ filters
   One state, read by every view. Screen dims what does not match, List and
   Cover drop it, and the applied set is shown as removable chips with a reset
   that is present whenever anything is on. Five controls: the guidance is that
   a filter bar past about seven controls stops being read, and the seventeen
   chips this replaced were only ever visible on one of the four views. */
var F={group:[],count:[],dec:'',ph:false};

/* Build 66. Two choices on one count read as "Yes or Partly", which is how the
   page's own rule reads them. They used to combine with AND, so ticking Yes
   greyed out Partly and No on the same count. Choices on different counts still
   combine with AND. */
function inFilters(t){
  if(F.group.length&&F.group.indexOf(t.group)<0) return false;
  if(F.dec==='any'&&!t.has_decider) return false;
  if(F.dec==='ok'&&!t.decider_confirmed) return false;
  if(F.dec==='chk'&&!t.decider_caveat) return false;
  if(F.ph&&!(t.phone||t.email)) return false;
  var ax={};
  for(var i=0;i<F.count.length;i++){
    var p=F.count[i].split(':'); (ax[p[0]]=ax[p[0]]||[]).push(p[1]);
  }
  for(var k in ax){ if(ax[k].indexOf(t.marks[k])<0) return false; }
  return true;
}
function activeFilters(){
  var out=[];
  F.group.forEach(function(g){out.push(['group:'+g,GL[g]||g]);});
  F.count.forEach(function(k){
    var p=k.split(':');out.push([ 'count:'+k, AXN[p[0]]+' '+W[p[1]] ]);});
  if(F.dec==='any') out.push(['dec','Named decision-maker']);
  if(F.dec==='ok') out.push(['dec','Named and confirmed']);
  if(F.dec==='chk') out.push(['dec','Named, needs confirming']);
  if(F.ph) out.push(['ph','Phone or email published']);
  return out;
}
function clearFilters(){F={group:[],count:[],dec:'',ph:false};}

var AXN={repeatability:'Repetition',machine_fit:'Printer fit',innovation:'Track record'};
var FMENU=null;

function closeMenu(){
  if(!FMENU) return;
  var o=document.querySelector('.fsel.open');
  if(o){o.classList.remove('open');var b=o.querySelector('button');if(b)b.setAttribute('aria-expanded','false');}
  var m=document.getElementById('fmenu'); if(m) m.remove();
  FMENU=null;
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.fsel')) closeMenu();
},true);
document.addEventListener('keydown',function(e){
  if(!FMENU) return;
  if(e.key==='Escape'){var tb=FMENU.querySelector('button');e.stopPropagation();closeMenu();
    if(tb) tb.focus();return;}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    var bs=[].slice.call(FMENU.querySelectorAll('.fmenu button:not([disabled])'));
    if(!bs.length) return; e.preventDefault();
    var i=bs.indexOf(document.activeElement);
    i=(i<0)?0:(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length; bs[i].focus();}
},true);

/* Counts are taken against everything else currently applied, so a menu never
   offers a choice that would return nothing. */
function optionCount(kind,key){
  var save={group:F.group.slice(),count:F.count.slice(),dec:F.dec,ph:F.ph};
  if(kind==='group'){if(save.group.indexOf(key)<0) save.group=save.group.concat([key]);}
  else if(kind==='count'){if(save.count.indexOf(key)<0) save.count=save.count.concat([key]);}
  else if(kind==='ph') save.ph=true;
  else save.dec=key;
  var keep=F;F=save;
  var n=T.filter(function(t){return inFilters(t)&&textHit(t);}).length;
  F=keep;return n;
}

function menuFor(kind,axis){
  var rows=[];
  if(kind==='group'){
    ['adopter','a','b','trade','creative','national','channel','icon'].forEach(function(g){
      if(!T.some(function(t){return t.group===g;})) return;
      rows.push(['group:'+g, GL[g]||g, F.group.indexOf(g)>=0, optionCount('group',g)]);});
  }else if(kind==='count'){
    ['clear','partial','fail'].forEach(function(m){
      var k=axis+':'+m;
      rows.push(['count:'+k, W[m], F.count.indexOf(k)>=0, optionCount('count',k)]);});
  }else{
    rows.push(['dec','Named decision-maker', F.dec==='any', optionCount('dec','any')]);
    rows.push(['dec2','Named and confirmed', F.dec==='ok', optionCount('dec','ok')]);
    rows.push(['dec3','Named, needs confirming', F.dec==='chk', optionCount('dec','chk')]);
    rows.push(['ph','Phone or email published', F.ph, optionCount('ph',true)]);
  }
  return '<div class="fmenu" id="fmenu" role="group">'+rows.map(function(r){
    return '<button role="checkbox" aria-checked="'+r[2]+'" data-f="'+r[0]+'"'+
      (r[3]===0&&!r[2]?' disabled':'')+'><i></i>'+esc(r[1])+'<s>'+r[3]+'</s></button>';}).join('')+'</div>';
}

function drawFilterBar(){
  var defs=[['group',null,'Section'],
            ['count','repeatability','Repetition'],
            ['count','machine_fit','Printer fit'],
            ['count','innovation','Track record'],
            ['dec',null,'Contact']];
  var bar=defs.map(function(d){
    var n=0;
    if(d[0]==='group') n=F.group.length;
    else if(d[0]==='count') n=F.count.filter(function(k){return k.indexOf(d[1]+':')===0;}).length;
    else n=(F.dec?1:0)+(F.ph?1:0);
    return '<div class="fsel" data-kind="'+d[0]+'" data-axis="'+(d[1]||'')+'">'+
      '<button aria-expanded="false" aria-controls="fmenu">'+esc(d[2])+
      (n?'<span class="nsel">'+n+'</span>':'')+'<span class="car">▼</span></button></div>';
  }).join('');
  var shown=T.filter(function(t){return inFilters(t)&&textHit(t);}).length;
  document.getElementById('fbar').innerHTML=bar+
    '<span class="fcount">'+shown+' of '+T.length+' firms</span>'+

/* ---------------------------------------------------------------- workbook
   A real .xlsx written in the page, because the file has to stay self-contained
   and a CSV loses the column widths, the header and the text formatting that
   make a contact list usable the moment it opens. Store-only ZIP: no
   compression, which Excel accepts and which fits in ninety lines. */
var CRC=(function(){var t=[];for(var n=0;n<256;n++){var c=n;
  for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  return function(buf){var c=0xFFFFFFFF;
    for(var i=0;i<buf.length;i++)c=t[(c^buf[i])&0xFF]^(c>>>8);
    return (c^0xFFFFFFFF)>>>0;};})();
function u8(str){return new TextEncoder().encode(str);}
function zip(files){
  var parts=[],cd=[],off=0;
  files.forEach(function(f){
    var data=u8(f.data),name=u8(f.name),crc=CRC(data);
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);
    lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(8,0,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);
    ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  });
  var cdLen=cd.reduce(function(a,b){return a+b.length;},0);
  var eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,files.length,true);
  eo.setUint16(10,files.length,true);eo.setUint32(12,cdLen,true);eo.setUint32(16,off,true);
  return new Blob(parts.concat(cd,[new Uint8Array(eo.buffer)]),
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xesc(v){return String(v==null?'':v)

  var body=rows.map(function(r,ri){

        '><is><t xml:space="preserve">'+xesc(c)+'</t></is></c>';}).join('')+'</row>';}).join('');

   {name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
