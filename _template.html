/* What actually goes in the file: one row per contact, because that is the
   shape a CRM import and a call sheet both want, with the firm's screen
   repeated alongside. A firm with no named contact still gets a row, so the
   gap travels with the list rather than disappearing from it. */
var XCOLS=[['Firm',30],['Section',22],['Repetition',12],['Printer fit',11],['Track record',13],
           ['Region',24],['Headline',34],['Contact',22],['Title',34],['Decides the wall',15],
           ['Status',16],['LinkedIn',46],['Named on',46],['Website',34],['The screen',60],
           ['Phone',18],['Phone label',26],['Phone source',46],['Email',32],['Email source',46]];
function exportRows(list){
  var rows=[XCOLS.map(function(c){return c[0];})];
  list.forEach(function(t){
    var base=[t.entity_name, GL[t.group]||'', W[t.marks.repeatability], W[t.marks.machine_fit],
              W[t.marks.innovation], t.region||'', t.key_stat||''];
    /* Firm-level, so it rides on every row for that firm and on the empty row
       too. The three cells stay together: a number with no source beside it is
       not something this file ships. */
    var ph=[t.phone?dial(t.phone):'', t.phone_label||'', t.phone_source||'',
            t.email||'', t.email_source||''];
    var ppl=(t.principals||[]).slice().sort(function(a,b){return (b.decider?1:0)-(a.decider?1:0);});
    if(!ppl.length){
      rows.push(base.concat(['','','','No contact published','','',t.homepage_url||'',
                             t.mvp_screen||''],ph));
      return;}
    ppl.forEach(function(pp){
      var st=pp.departed?'Departed':(pp.entity_note?'Confirm entity':(pp.probable?'Unconfirmed':'Current'));
      rows.push(base.concat([pp.name, pp.role||'', pp.decider?'Yes':'', st,
        pp.linkedin_url||'', pp.source_url||'', t.homepage_url||'', t.mvp_screen||''],ph));
    });
  });
  return rows;
}
function xnote(msg){
  var note=document.getElementById('xnote');
  if(note){note.textContent=msg;note.hidden=false;}
}
function downloadXlsx(list,label){
  if(!list.length) return;
  var rows=exportRows(list);
  var blob=buildXlsx(rows,XCOLS.map(function(c){return c[1];}),'Prospects');
  var name=(PL.file||'Houston')+'_Prospects_'+label+'_'+(D.last_updated||'').replace(/-/g,'')+'.xlsx';
  var n=rows.length-1;
  var hosted=!!(window.claude&&typeof window.claude.use==='function');
  if(hosted){
    window.claude.use('downloads').then(function(dl){
      if(!dl){xnote('Saving is not available in this view.');return;}
      return dl.save({filename:name,data:blob}).then(function(){
        xnote(n+' rows saved as '+name);
      },function(err){
        var c=err&&err.code;
        if(c==='declined') return;
        if(c==='rate_limited') xnote('A save prompt is already open.');
        else xnote('Saving is not available in this view.');
      });
    });
    return;
  }
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
  xnote(n+' rows written to '+name);
}

var CF_SPACING=96, CF_SHIFT=180, CF_Z=110, CF_ROT=58, CF_SCALE=.82;
var cfArr=[], cfCards=[], cfFocus=0, cfFloat=0, cfRaf=null;

function coverNameLines(name){
  var primary=name.split(/[\u2014\u00b7\/]/)[0].trim(), w=primary.split(/\s+/);
  if(w.length<=2) return [primary.toUpperCase()];
  if(w.length<=4){var m=Math.ceil(w.length/2);
    return [w.slice(0,m).join(' ').toUpperCase(), w.slice(m).join(' ').toUpperCase()];}
  var t=Math.ceil(w.length/3);
  return [w.slice(0,t).join(' ').toUpperCase(), w.slice(t,2*t).join(' ').toUpperCase(),
          w.slice(2*t).join(' ').toUpperCase()];
}
function coverNameSize(lines){
  var m=Math.max.apply(null,lines.map(function(l){return l.length;}));
  if(m<=10) return 28; if(m<=14) return 23; if(m<=18) return 19; if(m<=22) return 16; return 14;
}
function host(u){return u?u.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,''):'';}

function buildCover(t,idx){
  var el=document.createElement('div');
  el.className='cf-card i-'+t.marks.innovation+(t.group==='adopter'?' adopter':'');
  el.dataset.idx=idx; el.dataset.id=t.target_id;
  el.setAttribute('tabindex','-1'); el.setAttribute('role','button');
  el.setAttribute('aria-label',t.entity_name+'. '+(D.group_labels[t.group]||'')+'. Open firm.');
  var lines=coverNameLines(t.entity_name), sz=coverNameSize(lines);
  var counts=[['repeatability','Repetition','m1'],['machine_fit','Printer fit','m3'],['innovation','Track record','m2']]
    .map(function(a){return '<span class="'+a[2]+' '+t.marks[a[0]]+'">'+a[1]+' '+W[t.marks[a[0]]]+'</span>';}).join('');
  var face='<span class="pip"></span>'+
    '<div class="t-row"><span>'+esc(t.region||'')+'</span></div>'+
    '<div class="cname" style="font-size:'+sz+'px">'+lines.map(esc).join('<br>')+'</div>'+
    /* Build 83. The screen line whole, or cut at a word with an ellipsis. It
       was cut at 118 characters, mid-word. */
    '<div class="csyn">'+esc(clip(t.mvp_screen||'',170))+'</div>'+
    '<div class="crow">'+counts+'</div>';
  el.innerHTML='<div class="tile">'+face+'</div>'+
    '<div class="reflection"><div class="tile">'+face+'</div></div>';
  return el;
}
function applyCoverTransforms(){
  var cx=cfFloat, n=cfCards.length;
  var dragging=document.getElementById('cfStage').classList.contains('dragging');
  for(var i=0;i<n;i++){
    var el=cfCards[i], d=i-cx, abs=Math.abs(d);
    if(abs>6){el.style.display='none';continue;}
    el.style.display='';
    var sgn=d===0?0:(d>0?1:-1);
    var x=d*CF_SPACING+sgn*Math.min(abs,1)*CF_SHIFT;
    var rot=sgn*-CF_ROT*Math.min(abs,1);
    var z=-Math.min(abs,4)*CF_Z;
    var scale=Math.max(.55,1-Math.min(abs,3)*(1-CF_SCALE));
    el.style.transform='translate3d('+x+'px,0,'+z+'px) rotateY('+rot+'deg) scale('+scale+')';
    el.style.opacity=abs>4?Math.max(0,1-(abs-4)*.5):1;
    el.style.zIndex=String(1000-Math.round(abs*10));
    el.style.filter=(dragging||abs<=1.2)?'':
      'brightness('+(0.92+Math.max(0,1.6-abs)*0.05)+') saturate(.6)';
  }
}
function updateCfTitle(){
  var t=cfArr[Math.max(0,Math.min(cfArr.length-1,Math.round(cfFloat)))];
  if(!t){document.getElementById('cfTitle').innerHTML='';return;}
  var hot=t.marks.innovation==='clear';
  document.getElementById('cfTitle').innerHTML=
    '<div class="name">'+esc(t.entity_name)+'</div>'+
    '<div class="meta">'+esc(D.group_labels[t.group]||'')+' &middot; '+esc(t.region||'')+
      (t.key_stat?' &middot; '+esc(t.key_stat):'')+'</div>'+
    '<div class="badge2'+(hot?' o':'')+'">'+
      (hot?'Has paid for a new method before':(t.has_decider?'Decision-maker named':'No decision-maker named'))+'</div>';
  document.getElementById('cfCount').textContent=
    (Math.max(0,Math.min(cfArr.length-1,Math.round(cfFloat)))+1)+' of '+cfArr.length;
  cfCards.forEach(function(c,i){c.setAttribute('tabindex',i===cfFocus?'0':'-1');});
}
function updateScrub(){
  var pos=document.getElementById('cfPos');
  if(!pos) return;
  var pct=cfArr.length<=1?0:cfFloat/(cfArr.length-1);
  pos.style.left=(pct*100)+'%';
}
function reducedMotion(){
  return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
function startEase(){
  if(reducedMotion()){cfFloat=cfFocus;applyCoverTransforms();updateCfTitle();updateScrub();return;}
  if(cfRaf) return;
  var tick=function(){
    cfRaf=null;
    var diff=cfFocus-cfFloat;
    if(Math.abs(diff)<0.003){cfFloat=cfFocus;applyCoverTransforms();updateCfTitle();updateScrub();return;}
    cfFloat+=diff*0.16;               // the iPod ease
    applyCoverTransforms();updateCfTitle();updateScrub();
    cfRaf=requestAnimationFrame(tick);
  };
  cfRaf=requestAnimationFrame(tick);
}
function drawScroll(){
  cfArr=T.filter(hit);
  var scene=document.getElementById('cfScene');
  scene.innerHTML='';
  if(!cfArr.length){
    document.getElementById('cfTitle').innerHTML='<div class="meta">No firm matches the filters applied.</div>';
    document.getElementById('cfCount').textContent='0 of 0';cfCards=[];return;}
  if(cfFocus>=cfArr.length) cfFocus=0;
  cfFloat=cfFocus;
  cfCards=cfArr.map(buildCover);
  cfCards.forEach(function(n){scene.appendChild(n);});
  if(cfCards[cfFocus]) cfCards[cfFocus].setAttribute('tabindex','0');
  applyCoverTransforms();updateCfTitle();updateScrub();
}
function cfStep(k,focusCard){
  if(!cfArr.length) return;
  cfFocus=Math.max(0,Math.min(cfArr.length-1,cfFocus+k));
  startEase();
  if(focusCard&&cfCards[cfFocus]) cfCards[cfFocus].focus();
}

function drawField(){
  var R=D.icon_record||{},C=D.competitors||[];
  var NW=['None','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen'];
  document.getElementById('fieldTitle').textContent=(NW[C.length]||String(C.length))+' printers, and ICON\u2019s own record';

  var h='';
  h+='<div class="us"><h3>ICON</h3><p class="cl3">'+esc(R.line||'')+'</p><dl>'+
    (R.facts||[]).map(function(f){return '<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>';}).join('')+
    '</dl>'+
    /* Build 73. ICON's own record carries its sources, as every competitor does. */
    /* Build 81. The sources fold under a count, so the facts end the block. */

      return '<li><a href="'+esc(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>'+
        '<span class="host">'+esc(host(l[1]).split('/')[0])+'</span></li>';}).join('')+'</ul></details>':'')+
    '</div>';

     market, elsewhere in Texas, outside Texas, then the three gone or going,

    if(RXL.test(c.where||'')) return 0; if(/Texas|Houston|Dallas/.test(c.where||'')) return 1; return 2;}
  var TIERS=['Printing in '+PL.name,'Elsewhere in Texas','Outside Texas','Gone or going'];
  C=C.map(function(c,i){return {c:c,i:i,t:tier(c)};}).sort(function(a,b){return a.t-b.t||a.i-b.i;});
  var lastTier=-1;

    if(o.t!==lastTier){lastTier=o.t; head='<div class="ctier"><span>'+esc(TIERS[o.t])+'</span><b>'+
      C.filter(function(x){return x.t===o.t;}).length+'</b></div>';}
    return head+(function(c){
    var cls=(c.status==='closed'||c.status==='bankrupt')?' dead':(c.status==='sold'||c.status==='stalled'?' warn':'');
    /* Who they are, in links. The section named twelve competitors and gave a
       reader no way to reach any of them until Build 58. */
    /* The row that says "Their site" is the header, now that the header is the
       link. Printing it twice is the kind of repetition this deck keeps taking
       out of the prose. */
    var lk=(c.links||[]).filter(function(l){return l[1]!==c.site;}).map(function(l){
      return '<li><a href="'+esc(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>'+
        '<span class="host">'+esc(host(l[1]).split('/')[0])+'</span></li>';}).join('');
    /* The name is the link. It was the one thing on the card a reader would
       reach for and the one thing that was not clickable. A firm that has shut
       and publishes nothing keeps a plain name. */
    var nm=c.site?'<a class="hlink" href="'+esc(c.site)+'" target="_blank" rel="noopener">'+
      esc(c.name)+'<span class="hout">'+SVG.out+'</span></a>':esc(c.name);
    return '<div class="cmp"><h3>'+nm+'<span class="where">'+esc(c.where)+'</span>'+
      '<span class="st'+cls+'">'+esc(c.status)+'</span></h3>'+

      (c.facts||[]).map(function(f){return '<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>';}).join('')+
      '</dl>'+
      (lk?'<details class="clinksd"><summary>Sources, '+(c.links||[]).filter(function(l){return l[1]!==c.site;}).length+'</summary><ul class="clinks">'+lk+'</ul></details>':'')+
      '</div>';})(c);}).join('');
  var K=D.code||{};
  if(K.items&&K.items.length){
    var row=function(a,b,u,l){return '<tr><td class="q">'+esc(a)+'</td><td>'+esc(b)+'</td>'+
      '<td class="s"><a class="src" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(l)+'</a></td></tr>';};
    h+='<section class="codeblk"><div class="lab">Code and permitting</div>'+
      '<h3>'+esc(K.line||'')+'</h3>'+
      '<div class="scroll"><table class="ctab"><thead><tr><th>Question</th><th>Answer</th><th>Source</th></tr></thead><tbody>'+
      K.items.map(function(k){return row(k.q,k.a,k.url,k.source);}).join('')+'</tbody></table></div>'+
      '<div class="lab" style="margin-top:34px">Precedent</div>'+
      '<div class="scroll"><table class="ctab"><thead><tr><th>Project</th><th>Where</th><th>Status</th><th>Source</th></tr></thead><tbody>'+
      (K.precedent||[]).map(function(p){return '<tr><td class="q">'+esc(p.project)+'</td><td>'+esc(p.where)+'</td><td>'+esc(p.what)+
        '</td><td class="s"><a class="src" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.source)+'</a>'+
        (p.more||[]).map(function(m){return ' <a class="src" href="'+esc(m.url)+'" target="_blank" rel="noopener">'+esc(m.source)+'</a>';}).join('')+
        '</td></tr>';}).join('')+

/* Cover-flow input. Horizontal wheel and trackpad only, so vertical scroll
   still moves the page. Drag is discriminated from a tap by distance and
   direction: under six pixels is a tap, a predominantly vertical move is
   released back to the browser. Ported from the Americas deck. */
(function(){
  var stage=document.getElementById('cfStage');
  var wheelAccum=0,wheelTimer=null;
  stage.addEventListener('wheel',function(e){
    if(mode!=='scroll') return;
    var horizontal=Math.abs(e.deltaX)>Math.abs(e.deltaY)+2;
    if(!horizontal&&!e.shiftKey) return;
    e.preventDefault();
    wheelAccum+=(horizontal?e.deltaX:e.deltaY)*0.003;
    if(Math.abs(wheelAccum)>=1){
      var steps=Math.trunc(wheelAccum);
      cfFocus=Math.max(0,Math.min(cfArr.length-1,cfFocus+steps));
      wheelAccum-=steps;startEase();
    }
    clearTimeout(wheelTimer);wheelTimer=setTimeout(function(){wheelAccum=0;},160);
  },{passive:false});

  var startX=0,startY=0,startFocus=0,pid=null,didDrag=false,captured=false,downAt=0,decided=false;
  var dragRaf=null;
  var pxPerStep=120,TAP_PX=6,DIR_PX=10,TAP_MS=350;
  stage.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0) return;
    pid=e.pointerId;startX=e.clientX;startY=e.clientY;startFocus=cfFocus;
    didDrag=false;captured=false;decided=false;downAt=performance.now();
  });
  stage.addEventListener('pointermove',function(e){
    if(pid!==e.pointerId) return;
    var dx=e.clientX-startX,dy=e.clientY-startY,adx=Math.abs(dx),ady=Math.abs(dy);
    if(!decided&&(adx>DIR_PX||ady>DIR_PX)){
      decided=true;

      didDrag=true;
      try{stage.setPointerCapture(e.pointerId);captured=true;}catch(err){}
      stage.classList.add('dragging');
    }
    if(!didDrag) return;
    e.preventDefault();
    cfFloat=Math.max(0,Math.min(cfArr.length-1,startFocus-dx/pxPerStep));
    if(!dragRaf) dragRaf=requestAnimationFrame(function(){
      dragRaf=null;applyCoverTransforms();updateScrub();updateCfTitle();});
  },{passive:false});
  var end=function(e){
    if(pid!==e.pointerId) return;
    if(dragRaf){cancelAnimationFrame(dragRaf);dragRaf=null;}
    if(captured){try{stage.releasePointerCapture(pid);}catch(err){}}
    pid=null;captured=false;stage.classList.remove('dragging');
    var elapsed=performance.now()-downAt;
    if(didDrag){cfFocus=Math.max(0,Math.min(cfArr.length-1,Math.round(cfFloat)));startEase();return;}
    if(elapsed>TAP_MS) return;
    var hit=document.elementFromPoint(e.clientX,e.clientY);
    var card=hit&&hit.closest?hit.closest('.cf-card'):null;
    if(!card) return;
    var i=parseInt(card.dataset.idx,10);
    if(i===cfFocus) openFirm(card.dataset.id); else {cfFocus=i;startEase();}
  };
  stage.addEventListener('pointerup',end);
  stage.addEventListener('pointercancel',end);
})();

/* The opener. The headline prints one layer per line, each pass running the

function printOpener(force){
  var hl=document.getElementById('hl'), host=hl&&hl.parentNode;

  var seen=false; try{seen=sessionStorage.getItem('rolodex-opened')==='1';}catch(e){}

  if(seen&&force!==true) return;

    if(L){L.left=Math.min(L.left,r.left);L.right=Math.max(L.right,r.right);L.bottom=Math.max(L.bottom,r.bottom);}
    else lines.push({top:r.top,bottom:r.bottom,left:r.left,right:r.right});
  });

    lyr.style.top=(kb.top-cb.top)+'px'; lyr.style.left=(kb.right-cb.left+18)+'px'; lyr.style.right='auto';}
  host.appendChild(lyr);

  var dur=lines.map(function(l){return Math.min(460,170+(l.right-l.left)*0.34);});

    if(over) return;
    if(t0===null) t0=ts;
    var t=ts-t0, acc=0, i=0;
    while(i<n&&t>acc+dur[i]+60){acc+=dur[i]+60;i++;}
    if(i>=n){finish();return;}
    var p=Math.max(0,Math.min(1,(t-acc)/dur[i])), e=ease(p), L=lines[i], ltr=!(i%2);
    var x=ltr?L.left+(L.right-L.left)*e:L.right-(L.right-L.left)*e;
    var y0=i?lines[i-1].cut:0, y1=(i===n-1)?H:L.cut;
    var pts=ltr?['0 0',W+'px 0',W+'px '+y0+'px',x+'px '+y0+'px',x+'px '+y1+'px','0 '+y1+'px']
               :['0 0',W+'px 0',W+'px '+y1+'px',x+'px '+y1+'px',x+'px '+y0+'px','0 '+y0+'px'];
    hl.style.clipPath='polygon('+pts.join(',')+')';
    var b=beads[i]||bead(i);
    var a=ltr?L.left:x, w=Math.abs(x-(ltr?L.left:L.right));
    b.style.left=(hb.left-cb.left+a)+'px'; b.style.width=w+'px';
    for(var j=0;j<i;j++) if(beads[j]&&!beads[j].classList.contains('done')) beads[j].classList.add('done');
    lyr.innerHTML='Layer <b>'+String(i+1).padStart(2,'0')+'</b> / '+String(n).padStart(2,'0');
    raf=requestAnimationFrame(frame);
  }
  function finish(){
    if(over) return; over=true; cancelAnimationFrame(raf);
    hl.style.clipPath='';
    beads.forEach(function(b){if(b) b.classList.add('done');});
    later.forEach(function(e,k){e.classList.add('post');
      setTimeout(function(){e.classList.remove('pre');},40+k*90);
      setTimeout(function(){e.classList.remove('post');},700+k*90);});
    lyr.style.opacity='0';
    setTimeout(function(){lyr.remove();beads.forEach(function(b){if(b) b.remove();});},700);
    ['keydown','pointerdown','wheel','touchstart'].forEach(function(ev){window.removeEventListener(ev,finish);});
  }
  ['keydown','pointerdown','wheel','touchstart'].forEach(function(ev){window.addEventListener(ev,finish,{passive:true});});
  setTimeout(finish,total+800);
  hl.style.clipPath='polygon(0 0,0 0,0 0)';
  raf=requestAnimationFrame(frame);
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
  requestAnimationFrame(printOpener);});

/* Build 75. Weight. See the note on .landed in the stylesheet. */
function buzz(ms){if(MOTION&&navigator.vibrate){try{navigator.vibrate(ms);}catch(e){}}}
function retrigger(el,cls){if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(function(){el.classList.remove(cls);},700);}
function beat(){retrigger(document.querySelector('.mark i'),'beat');}
function land(el,ms){
  if(!el) return;
  var r=el.closest('tr')||el.closest('.chip')||el.closest('.cmp')||el.closest('.cf-card')||el;
  if(r.classList.contains('cf-card')) return;
  r.classList.remove('landed'); void r.offsetWidth; r.classList.add('landed');
  setTimeout(function(){r.classList.remove('landed');},ms||1500);
}
/* Every action is read before the page's own handler runs, and answered after
   it has redrawn. */
window.addEventListener('click',function(e){
  var el=e.target; if(!el||!el.closest) return;
  var ad=el.closest('[data-add]'), many=el.closest('[data-addmany]');
  if(ad||many){
    var ids=ad?[ad.dataset.add]:many.dataset.addmany.split(',');
    var before=call.length;
    requestAnimationFrame(function(){
      ids.forEach(function(id){document.querySelectorAll('[data-add="'+id+'"]').forEach(function(b){retrigger(b,'pop');});});
      if(many) retrigger(document.querySelector('[data-addmany="'+many.dataset.addmany+'"]'),'pop');
      retrigger(document.getElementById('clN'),'bump');
      var rb=document.querySelector('.rowadd[data-add="'+ids[0]+'"]'); if(rb) land(rb,900);
      buzz(call.length>before?10:6); beat();
    });
    return;
  }
  if(el.closest('.seg.views button')||el.closest('[data-id]')||el.closest('.fbtn2')||el.closest('#openCall')||
     (el.closest('#stageList tbody tr:not(.grp):not(.chn)')&&!el.closest('button,a'))||
     el.closest('#home')||el.closest('#back')||el.closest('[data-back]')){buzz(6);beat();return;}
  if(el.closest('[data-f]')||el.closest('.fsel>button')||el.closest('button.stat')||el.closest('.freset')||
     el.closest('[data-pmode]')||el.closest('[data-jyr]')||el.closest('[data-seg]')){beat();return;}
},true);
/* Build 78. On a phone the bar is three rows, about 140px of an 844px screen.
   Reading down slides the top two away and leaves the view switcher and the
   scroll line; any move up brings them back, and so does a change to the call
   list, so the count that jumps is on screen when it jumps. */
(function(){
  var mq=window.matchMedia&&window.matchMedia('(max-width:760px),(max-height:500px) and (max-width:1060px)');
  var nav=document.querySelector('nav'), root=document.documentElement, last=window.scrollY, acc=0;
  function hideBy(){var sg=document.querySelector('.navtools .seg.views');
    if(!sg||!nav) return 0; return Math.max(0,Math.round(sg.getBoundingClientRect().top-nav.getBoundingClientRect().top-8));}
  function up(){root.classList.remove('navup');}
  function tick(){
    if(!mq||!mq.matches){up();last=window.scrollY;return;}
    var y=window.scrollY, d=y-last; last=y;
    var ae=document.activeElement;
    if(ae&&ae.id==='q'){up();return;}
    if(y<(nav?nav.offsetHeight:140)+40){up();acc=0;return;}
    acc=(d>0)===(acc>0)?acc+d:d;
    if(acc>24&&!root.classList.contains('navup')){
      root.style.setProperty('--navhide',hideBy()+'px'); root.classList.add('navup');}
    else if(acc<-18) up();
  }
  window.addEventListener('scroll',tick,{passive:true});
  window.addEventListener('resize',function(){up();});
  document.addEventListener('focusin',function(e){if(e.target&&e.target.closest&&e.target.closest('nav')) up();});
  var cl=document.getElementById('clN');
  if(cl&&window.MutationObserver) new MutationObserver(up).observe(cl,{childList:true,characterData:true,subtree:true});
})();
/* Back from a firm page marks the row it came from. */
(function(){
  var _g=goIndex; goIndex=function(p){var was=view; _g(p);
    if(was==='firm'){var a=document.activeElement; if(a&&a!==document.body) land(a); beat();}};
})();
/* The filter count ticks whenever the set of firms changes, whatever changed it. */
(function(){
  var box=document.getElementById('filters'), last=null;
  if(!box||!window.MutationObserver) return;
  new MutationObserver(function(){
    var fc=box.querySelector('.fcount'); if(!fc) return;
    var v=fc.textContent; if(last!==null&&v!==last){fc.classList.add('tick'); beat();}
    last=v;
  }).observe(box,{childList:true,subtree:true,characterData:true});
})();
/* The theme toggle turns, and the colours cross over instead of cutting. */
(function(){
  var b=document.getElementById('thm'); if(!b) return;
  b.addEventListener('click',function(){
    b.classList.toggle('turn');
    if(!MOTION) return;
    var h=document.documentElement; h.classList.add('theming');
    setTimeout(function(){h.classList.remove('theming');},340);
  },true);
})();
/* Switching market: the accent turns to the other city's at once, a line runs
   under the nav in it, and then the page reloads on that market. */
(function(){
  var box=document.getElementById('mktSw'); if(!box) return;
  box.addEventListener('click',function(e){
    var b=e.target.closest('[data-mkt]'); if(!b||b.getAttribute('data-mkt')===MKT) return;
    var k=b.getAttribute('data-mkt');
    try{sessionStorage.setItem('rolodex-arrive','1');}catch(x){}
    if(!MOTION) return;
    e.stopImmediatePropagation(); e.preventDefault();
    document.documentElement.setAttribute('data-market',k);
    [].slice.call(box.querySelectorAll('button')).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
    var sl=document.getElementById('sline'); if(sl){sl.classList.remove('sweep'); void sl.offsetWidth; sl.classList.add('sweep');}
    buzz(12);
    try{localStorage.setItem('rolodex-market',k);}catch(x){}
    var base=location.href.replace(/#.*$/,'');
    setTimeout(function(){location.replace(base+'#market='+k); location.reload();},300);
  },true);
  var arrived=false; try{arrived=sessionStorage.getItem('rolodex-arrive')==='1';sessionStorage.removeItem('rolodex-arrive');}catch(x){}
  /* The new market arrives with the line and its headline poured again, one
     layer a line, as on a first visit. */
  if(arrived&&MOTION){var sl=document.getElementById('sline'); if(sl) sl.classList.add('sweep');
    setTimeout(function(){if(sl) sl.classList.remove('sweep');},900);
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
      requestAnimationFrame(function(){printOpener(true);});});}
})();
/* The scroll line. It fills with the page, and its head steps at each section:
   the List's sections, the Market's figures, a firm page's blocks. */
(function(){
  var sl=document.getElementById('sline'); if(!sl) return;
  var fill=sl.querySelector('.fill'), head=sl.querySelector('.head'), ticks=[], at=-1, raf=0;
  function marks(){
    var sel=view==='firm'?'#firmBody .row':(mode==='list'?'#stageList tr.grp':(mode==='market'?'#mkBody .figs':''));
    var max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
    sl.querySelectorAll('.tk').forEach(function(t){t.remove();});
    ticks=sel?[].slice.call(document.querySelectorAll(sel)).map(function(e){
      var y=e.getBoundingClientRect().top+scrollY-64; return Math.max(0,Math.min(1,y/max));}):[];
    ticks.forEach(function(p){var t=document.createElement('i'); t.className='tk'; t.style.left=(p*100)+'%'; sl.appendChild(t);});
    at=-1; paint();
  }
  function paint(){
    raf=0;
    var max=Math.max(1,document.documentElement.scrollHeight-innerHeight), p=Math.max(0,Math.min(1,scrollY/max));
    fill.style.transform='scaleX('+p+')';
    head.style.left=(p*100)+'%';
    sl.classList.toggle('on',p>0.002&&p<0.998);
    var n=0; ticks.forEach(function(t){if(t<=p+0.001) n++;});
    var tk=sl.querySelectorAll('.tk'); for(var i=0;i<tk.length;i++) tk[i].classList.toggle('past',i<n);
    if(at>=0&&n!==at&&MOTION){retrigger(head,'hit');}
    at=n;
  }
  addEventListener('scroll',function(){if(!raf) raf=requestAnimationFrame(paint);},{passive:true});
  addEventListener('resize',function(){setTimeout(marks,60);});
  var _r=renderNow; renderNow=function(){_r(); requestAnimationFrame(marks);};
  var _o=openFirm; openFirm=function(id){_o(id); requestAnimationFrame(marks);};
  var _c=openCall; openCall=function(){_c(); requestAnimationFrame(marks);};
  var _g=goIndex; goIndex=function(p){_g(p); requestAnimationFrame(marks);};
  requestAnimationFrame(marks);
})();

/* Build 67. The theme toggle. It flips to the other theme and remembers the
   choice on this device; the charts drawn with explicit fills redraw. */
(function(){
  var b=document.getElementById('thm'), d=document.documentElement;
  function label(){var dk=d.getAttribute('data-theme')==='dark';
    b.setAttribute('aria-label',dk?'Use the light theme':'Use the dark theme');
    b.setAttribute('aria-pressed',dk?'true':'false');}
  label();
  new MutationObserver(function(){label();
    var mk=document.getElementById('mkBody'); if(mk&&mk.innerHTML) drawMarket();
  }).observe(d,{attributes:true,attributeFilter:['data-theme']});
  b.addEventListener('click',function(){
    var nx=d.getAttribute('data-theme')==='dark'?'light':'dark';
    try{localStorage.setItem('rolodex-theme',nx);}catch(e){}
    d.setAttribute('data-theme',nx);
  });
})();

/* A deliberate, read-mostly handle on the tool's internals. The verifier drives
   the workbook writer and the call list through it, and anyone scripting
   against the file gets a supported surface instead of reaching into globals
   that are free to change. */
window.rolodex={
  data:D, firms:T,
  filters:function(){return {group:F.group.slice(),count:F.count.slice(),dec:F.dec,ph:F.ph,q:q};},
  shown:function(){return T.filter(hit);},
  setFilters:function(f){f=f||{};F={group:(f.group||[]).slice(),count:(f.count||[]).slice(),
    dec:f.dec||'',ph:!!f.ph};render();return this.filters();},
  callList:function(){return call.slice();},
  setCallList:function(ids){call=(ids||[]).filter(function(i){return byId[i];});
    saveCall();render();return call.slice();},
  exportRows:exportRows,
  buildWorkbook:function(list){return buildXlsx(exportRows(list||T.filter(hit)),
    XCOLS.map(function(c){return c[1];}),'Prospects');},
  open:function(id){ if(byId[id]) openFirm(id); return view; },
  reset:function(){clearFilters();q='';document.getElementById('q').value='';render();}
};
})();
